<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經濟部新進職員甄試｜資訊管理・程式設計 考古題詳解</title>
<style>/* ===== 經濟部考古題複習系統 — 樣式 ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;   /* 朱紅 — 印章色 */
  --accent-2:   #1f5673;   /* 靛藍 */
  --gold:       #a07e2c;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色 */
  --t-db:   #1f5673;
  --t-ds:   #6a4c93;
  --t-prog: #2d6a4f;
  --t-sec:  #8a3324;
  --t-net:  --t-net;
  --t-net-c:#b5651d;
  --t-mis:  #4a5859;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(138,51,36,0.025) 31px, rgba(138,51,36,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
  position: relative;
}
.site-header::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -4px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 36px);
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 2.7rem);
  letter-spacing: .06em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent);
  color: var(--accent); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-4deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .9rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.7rem; color: var(--accent); line-height: 1;
}
.stat-bar .lbl {
  font-size: .72rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgba(244,241,234,0.97);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--line);
  padding: .9rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1.1rem; font-size: .88rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
}
.mode-switch button.active { background: var(--ink); color: var(--paper); }

.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .55rem .9rem .55rem 2.2rem; font-size: .9rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .7rem; top: 50%;
  transform: translateY(-50%); font-size: .85rem; opacity: .5;
}
.btn-expand {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-expand:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1080px; margin: .7rem auto 0;
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 20px;
  padding: .3rem .85rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.chip .c-count { opacity: .6; font-size: .92em; margin-left: .2em; }

/* ===== 主內容 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

/* 群組標題（年度 / 主題） */
.group {
  margin-bottom: 2.6rem;
}
.group-head {
  display: flex; align-items: center; gap: .9rem;
  margin-bottom: 1.1rem; padding-bottom: .6rem;
  border-bottom: 2.5px solid var(--ink);
}
.group-head .g-badge {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  background: var(--ink); color: var(--paper);
  padding: .35rem .8rem; border-radius: 6px; font-size: 1.05rem;
  white-space: nowrap;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.15rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .76rem; color: var(--ink-soft);
  text-align: right; line-height: 1.5;
}
.group-note {
  font-size: .8rem; color: var(--accent-2); font-style: italic;
  margin: -.5rem 0 1rem; padding-left: .2rem;
}

/* ===== 題目卡 ===== */
.q-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden; transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 16px var(--shadow); }

.q-header {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1rem 1.2rem; cursor: pointer;
  border-left: 5px solid var(--line);
  transition: background .15s;
}
.q-card.t-db   .q-header { border-left-color: var(--t-db); }
.q-card.t-ds   .q-header { border-left-color: var(--t-ds); }
.q-card.t-prog .q-header { border-left-color: var(--t-prog); }
.q-card.t-sec  .q-header { border-left-color: var(--t-sec); }
.q-card.t-net  .q-header { border-left-color: var(--t-net-c); }
.q-card.t-mis  .q-header { border-left-color: var(--t-mis); }
.q-header:hover { background: var(--paper-warm); }

.q-no {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1rem; color: var(--paper); background: var(--ink-soft);
  min-width: 2.4rem; height: 2.4rem; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-headmain { flex: 1; min-width: 0; }
.q-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.02rem; color: var(--ink); line-height: 1.5;
}
.q-tags {
  display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .4rem;
  align-items: center;
}
.tag {
  font-size: .7rem; font-weight: 700; padding: .12rem .55rem;
  border-radius: 4px; letter-spacing: .03em;
}
.tag-topic { color: #fff; }
.t-db   .tag-topic, .tag.topic-db   { background: var(--t-db); }
.t-ds   .tag-topic, .tag.topic-ds   { background: var(--t-ds); }
.t-prog .tag-topic, .tag.topic-prog { background: var(--t-prog); }
.t-sec  .tag-topic, .tag.topic-sec  { background: var(--t-sec); }
.t-net  .tag-topic, .tag.topic-net  { background: var(--t-net-c); }
.t-mis  .tag-topic, .tag.topic-mis  { background: var(--t-mis); }
.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-score {
  background: transparent; color: var(--gold);
  border: 1px solid var(--gold);
}
.tag-part {
  background: var(--accent-2); color: #fff;
  font-weight: 500;
}
/* 考試別標籤 */
.tag-exam {
  font-weight: 700; letter-spacing: .05em;
}
.tag-exam.exam-gy {
  background: #2563eb; color: #fff; border: 1px solid #2563eb;
}
.tag-exam.exam-customs {
  background: #16a34a; color: #fff; border: 1px solid #16a34a;
}
/* 考試別切換按鈕 */
.exam-switch {
  display: flex; border: 2px solid var(--accent-2); border-radius: 8px;
  overflow: hidden;
}
.exam-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem .9rem; font-size: .85rem; font-weight: 700;
  color: var(--accent-2); transition: all .18s;
  border-right: 1px solid var(--accent-2);
}
.exam-switch button:last-child { border-right: none; }
.exam-switch button.active { background: var(--accent-2); color: var(--paper); }
.exam-switch button:hover:not(.active) { background: rgba(165, 90, 51, 0.08); }
.q-toggle {
  flex-shrink: 0; font-size: 1.3rem; color: var(--ink-soft);
  transition: transform .25s; line-height: 1; margin-top: .4rem;
}
.q-card.open .q-toggle { transform: rotate(45deg); }

/* ===== 題目展開內容 ===== */
.q-body { display: none; padding: 0 1.2rem 1.4rem; }
.q-card.open .q-body { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.section-label {
  display: inline-block; font-family: 'Noto Serif TC', serif;
  font-weight: 700; font-size: .82rem; letter-spacing: .1em;
  padding: .25rem .8rem; border-radius: 4px; margin: 1.1rem 0 .6rem;
}
.section-label.q { background: var(--ink); color: var(--paper); }
.section-label.a { background: var(--accent); color: var(--paper); }

.q-question {
  background: var(--paper-warm); border-left: 3px solid var(--ink-soft);
  padding: .9rem 1.1rem; border-radius: 0 6px 6px 0;
  font-size: .93rem; white-space: pre-wrap; color: var(--ink-soft);
  font-feature-settings: "tnum";
}
.q-answer {
  font-size: .95rem; color: var(--ink);
}
.q-answer h4 {
  font-family: 'Noto Serif TC', serif; color: var(--accent);
  font-size: 1rem; margin: 1.1rem 0 .4rem;
  border-bottom: 1px dashed var(--line); padding-bottom: .2rem;
}
.q-answer p { margin: .55rem 0; }
.q-answer ul, .q-answer ol { margin: .5rem 0 .5rem 1.4rem; }
.q-answer li { margin: .3rem 0; }
.q-answer strong { color: var(--accent-2); font-weight: 700; }
.q-answer code {
  font-family: 'JetBrains Mono', monospace; font-size: .86em;
  background: var(--paper-warm); padding: .1em .35em;
  border-radius: 3px; color: var(--accent);
}
.q-answer table {
  border-collapse: collapse; width: 100%; margin: .8rem 0;
  font-size: .86rem;
}
.q-answer th, .q-answer td {
  border: 1px solid var(--line); padding: .4rem .6rem;
  text-align: left;
}
.q-answer th {
  background: var(--ink); color: var(--paper); font-weight: 700;
}
.q-answer tr:nth-child(even) td { background: var(--paper-warm); }

/* 程式碼/ASCII 區塊 */
.q-answer pre {
  background: #2b303b; color: #f2f0e9;
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  line-height: 1.7; padding: 1rem 1.2rem; border-radius: 8px;
  overflow-x: auto; margin: .8rem 0;
  border-left: 3px solid var(--gold);
}
.q-answer pre code { background: none; color: inherit; padding: 0; }

/* 獨立程式碼區（code 欄位） */
.code-block {
  margin: 1rem 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--ink);
}
.code-head {
  background: var(--ink); color: var(--gold);
  font-family: 'JetBrains Mono', monospace; font-size: .76rem;
  padding: .4rem .9rem; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.code-head .dots { display: flex; gap: .3rem; }
.code-head .dots span {
  width: .6rem; height: .6rem; border-radius: 50%; display: block;
}
.code-head .dots span:nth-child(1) { background: #d4554a; }
.code-head .dots span:nth-child(2) { background: #d9a441; }
.code-head .dots span:nth-child(3) { background: #5a9e6f; }
.code-block pre {
  margin: 0; border-radius: 0; border-left: none;
  background: #2b303b;            /* 提亮背景，降低與文字的明度落差刺眼感 */
  color: #f2f0e9;                 /* 預設文字（變數、標點）改為近白，清楚可見 */
  font-size: .86rem; line-height: 1.7;
  padding: 1.1rem 1.3rem 1.1rem 1.7rem;   /* 左側多留白，程式碼不貼邊、不壓迫 */
}
/* 語法highlight — 高對比配色，深背景下皆清晰 */
.tok-kw  { color: #ff9d6f; font-weight: 700; }   /* 關鍵字：亮橘，最醒目 */
.tok-str { color: #b8e986; }                      /* 字串：亮綠 */
.tok-com { color: #9aa6b8; font-style: italic; }  /* 註解：提亮的灰藍，不再灰到看不見 */
.tok-num { color: #f7d56e; }                      /* 數字：亮黃 */
.tok-fn  { color: #82c8ff; }                      /* 函式：亮藍 */
.tok-typ { color: #ffd166; }                      /* 型別：金黃 */

/* ===== HTML 圖表（取代易跑版的 ASCII 圖）===== */
.html-diagram {
  margin: 1.1rem 0; padding: 1.3rem 1rem;
  background: var(--paper-warm);
  border: 1.5px solid var(--line); border-radius: 10px;
  overflow-x: auto;
}
/* 通用方框節點 */
.dg-box {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); padding: .55rem .9rem;
  font-size: .86rem; line-height: 1.5; font-weight: 500;
  min-width: 5.5rem;
}
.dg-box .dg-sub { font-size: .73rem; color: var(--ink-soft); font-weight: 400; }
.dg-box.accent { border-color: var(--accent); background: #fbf3f0; }
.dg-box.blue   { border-color: var(--accent-2); background: #eef4f7; }
.dg-box.gold   { border-color: var(--gold); background: #faf5e6; }
.dg-box.ink    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dg-box.ink .dg-sub { color: #b8bcca; }

/* 排列容器 */
.dg-row { display: flex; align-items: center; justify-content: center;
  gap: .5rem; flex-wrap: wrap; }
.dg-col { display: flex; flex-direction: column; align-items: center;
  gap: .5rem; }
.dg-center { justify-content: center; }

/* 箭頭 */
.dg-arrow { font-size: 1.3rem; color: var(--accent); font-weight: 700;
  line-height: 1; padding: 0 .15rem; }
.dg-arrow.v { transform: rotate(90deg); margin: .1rem 0; }
.dg-arrow.bi::before { content: '◀▶'; }
.dg-arrow.down::before { content: '▼'; }
.dg-arrow.right::before { content: '▶'; }

/* 流程圖專用 */
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.flow-node {
  border: 2px solid var(--ink); background: var(--card);
  padding: .55rem 1.1rem; font-size: .86rem; text-align: center;
  font-weight: 500; max-width: 32rem; line-height: 1.55;
}
.flow-node.start, .flow-node.end {
  border-radius: 22px; background: var(--ink); color: var(--paper);
  font-weight: 700;
}
.flow-node.process { border-radius: 6px; }
.flow-node.io {
  border-radius: 6px; background: var(--paper-warm);
  border-style: dashed;
}
.flow-node.decision {
  background: #faf5e6; border-color: var(--gold);
  border-radius: 6px; font-weight: 700;
}
/* 連接線（直線 + 箭頭） */
.flow-conn { width: 2px; height: 1.6rem; background: var(--ink-soft);
  position: relative; }
.flow-conn::after {
  content: '▼'; position: absolute; bottom: -.3rem; left: 50%;
  transform: translateX(-50%); color: var(--ink-soft); font-size: .68rem;
}
/* 連接線旁的小標籤（如「否」「未出貨訂單」） */
.flow-edge {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.flow-edge .lbl {
  font-size: .74rem; font-weight: 700; padding: .08rem .55rem;
  border-radius: 4px; position: relative; z-index: 1;
}
.flow-edge .lbl.yes { background: #2d6a4f; color: #fff; }
.flow-edge .lbl.no  { background: var(--accent); color: #fff; }
.flow-edge .lbl.plain {
  background: var(--card); color: var(--accent-2);
  border: 1px solid var(--line);
}
.flow-conn.short { height: .7rem; }
.flow-conn.short::after { display: none; }

/* 迴圈返回標記 —— 掛在決策節點下方，明確標示「往回」 */
.flow-loop {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .76rem; font-weight: 700;
  background: #eef4f7; color: var(--accent-2);
  border: 1.5px dashed var(--accent-2); border-radius: 20px;
  padding: .25rem .8rem; margin: .35rem 0;
}
.flow-loop::before { content: '⟲'; font-size: 1.05rem; }

.flow-label {
  font-size: .73rem; color: var(--accent-2); font-weight: 600;
  background: var(--card); padding: 0 .4rem; margin: .15rem 0;
}
/* 舊版分支樣式（保留相容，僅用於少數真正左右並排的場景） */
.flow-branch { display: flex; align-items: flex-start; gap: 2.5rem;
  justify-content: center; }
.flow-branch-arm { display: flex; flex-direction: column;
  align-items: center; gap: 0; }
.flow-yes, .flow-no {
  font-size: .76rem; font-weight: 700; padding: .1rem .5rem;
  border-radius: 4px; margin: .2rem 0;
}
.flow-yes { background: #2d6a4f; color: #fff; }
.flow-no  { background: var(--accent); color: #fff; }

/* ERD 專用形狀 */
.erd-entity {
  border: 2px solid var(--ink); background: var(--card);
  padding: .5rem 1.1rem; font-weight: 700; font-size: .9rem;
  border-radius: 4px; text-align: center;
}
.erd-rel {
  display: inline-flex; align-items: center; justify-content: center;
  width: 7rem; height: 4rem; background: #faf5e6;
  border: 2px solid var(--gold);
  transform: rotate(45deg); margin: 1rem;
}
.erd-rel > span {
  transform: rotate(-45deg); font-size: .8rem; font-weight: 700;
  text-align: center; line-height: 1.3;
}
.erd-attr {
  display: inline-block; border: 1.5px solid var(--accent-2);
  background: #eef4f7; border-radius: 50%;
  padding: .35rem .8rem; font-size: .76rem; text-align: center;
  color: var(--accent-2);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; }

/* 回頂部 */
.to-top {
  position: fixed; right: 1.5rem; bottom: 1.5rem;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.to-top.show { opacity: 1; pointer-events: auto; }

/* 頁尾 */
.site-footer {
  background: var(--ink); color: #9aa0b0;
  text-align: center; padding: 2rem 1.5rem;
  font-size: .8rem; line-height: 1.8;
}
.site-footer strong { color: var(--gold); }

/* 手機 */

      score: 25,
      question: `用戶回報網路有「偶發高延遲」現象，網路管理員使用 traceroute 指令觀察到中間節點回應波動與路徑跳數不穩，請以 TTL 回應與非對稱路由概念診斷，試回答下列問題：（3題，共25分）

(三) 請就以下 5 種測試矩陣維度：協定/埠號、封包大小、時間、路徑、觀察邊界設備，排查該現象（包含從遠端測回）？（10分）`,
      answer: `**(一) TTL/ICMP 在路徑追蹤扮演的角色（5分）**

traceroute 的核心原理是「刻意製造 TTL 過期」。
- **TTL（Time To Live）**：IP 標頭中的欄位，每經過一個路由器（hop）就減 1。當 TTL 遞減到 0 時，該路由器會丟棄封包。
- traceroute 從 TTL=1 開始送出探測封包，第 1 台路由器將 TTL 減為 0、丟棄封包，並回送一個 **ICMP Time Exceeded（Type 11）** 訊息給來源端。來源端因此得知第 1 跳是誰。
- 接著送 TTL=2、TTL=3…逐步遞增，每一輪都會讓「第 N 台路由器」回應 ICMP Time Exceeded，於是一跳一跳地把整條路徑探測出來。
- 當封包終於抵達目的主機時，目的主機回送的是 **ICMP Port Unreachable（Type 3）**（UDP 版本）或 **ICMP Echo Reply**（ICMP 版本），traceroute 以此判斷「已到達終點」。
- **角色總結**：TTL 是「逐跳定位」的觸發機制，ICMP 回應訊息則是「身份回報」的載具。每一跳的往返時間（RTT）即為延遲量測依據。

**(二) 非對稱路徑出現的原因（10分）**

非對稱路由（Asymmetric Routing）指「去程路徑」與「回程路徑」不一致。常見原因：
1. **熱馬鈴薯路由（Hot-Potato Routing）**：每個 ISP 都想讓封包盡快離開自己的網路（把傳輸成本丟給下一個 ISP），因此去程與回程各自選擇對自己最有利的出口，導致路徑不對稱。
2. **多重對外連線（Multi-homing）**：企業或 ISP 有多條對外線路可選擇，去程走 A 線、回程經由對方選擇走 B 線。
3. **路由協定計算差異**：去程與回程各自獨立計算最短路徑，OSPF cost、BGP AS path 長度等度量值不同會造成不同選路。
4. **負載平衡（ECMP, Equal-Cost Multi-Path）**：當存在多條等成本路徑時，路由器依封包雜湊（來源/目的 IP、埠號）分流，去回方向雜湊結果不同。
5. **政策路由（Policy-Based Routing**：因管理者的路由政策設定，人為指定去回程走不同路徑。
6. **CDN 或 Anycast**：去程依照最短路徑導向最近節點,但回程未必走相同邏輯，可能導致不對稱。

對 traceroute 的影響：traceroute 只能看到「去程」路徑，量到的 RTT 卻包含「去程 + 回程」。若回程路徑壅塞，traceroute 會把延遲「錯誤歸咎」到去程的某一跳，造成中間節點回應波動的假象。

**(三) 5 種測試矩陣維度排查（10分）**

| 維度 | 排查方法 |
|---|---|
| **協定/埠號** | 分別用 ICMP、UDP、TCP（traceroute -I / -U / -T）測試。若僅某協定異常，代表中間設備對該協定做限速或 ACL 過濾（許多防火牆對 ICMP 低優先處理，造成「假高延遲」）。指定常見埠（80/443）測試是否被特殊對待。 |
| **封包大小** | 用不同 payload 大小測試（如 64 / 512 / 1400 / 1500 bytes）。若大封包才延遲或遺失，可能是 MTU 不匹配導致分片，或路徑上有 PMTUD 黑洞。 |
| **時間** | 在不同時段（離峰/尖峰）連續長時間量測，記錄延遲分布。「偶發」高延遲常與尖峰壅塞、排程備份、廣播風暴等週期性事件相關。 |
| **路徑** | 比對多次 traceroute 路徑是否一致。路徑跳動代表 ECMP 負載平衡或路由收斂不穩。同時從「遠端反向測回」（在對端主機對本端做 traceroute），比對去程與回程路徑差異，確認是否為非對稱路由造成。 |
| **觀察邊界設備** | 鎖定「企業 ↔ ISP 交界」「ISP ↔ ISP 交界」的邊界路由器。邊界設備常是 QoS 政策、ACL、NAT 的執行點。檢視該設備的介面流量、佇列丟棄（drop）、CPU 使用率，判斷瓶頸是否在交界處。 |

**綜合策略**：先用「從遠端測回」確認是否非對稱路由 → 再以協定/封包大小區隔出「設備限速」與「實際壅塞」→ 最後用時間維度確認週期性，並聚焦邊界設備佐證。`,

      score: 15,
      question: `請以企業域名(Domain Name)解析的角度，說明 DoH/DoT 與 DNSSEC 在資安功能上如何互補？（15分）`,
      answer: `**核心觀念：兩者保護的「面向」不同，因此互補。**

**DoH / DoT — 保護「傳輸過程的機密性」**
- **DoH（DNS over HTTPS）**：將 DNS 查詢包裝成 HTTPS 流量，走 443 埠，與一般網頁流量混在一起，更難被識別與封鎖。
- **DoT（DNS over TLS）**：將 DNS 查詢封裝在 TLS 加密通道中傳輸，使用專屬埠 853。
- **解決的問題**：傳統 DNS 以明文 UDP/53 傳輸，任何中間人（ISP、公共 Wi-Fi、攻擊者）都能**竊聽**使用者查詢了哪些網域，或進行**竄改/竄改回應**。DoH/DoT 提供**加密**與**傳輸完整性**，防止竊聽與中途竄改，保護使用者隱私。
- **限制**：DoH/DoT 只保證「從用戶端到 DNS 解析伺服器」這段路是加密的。它**無法驗證 DNS 回應的資料本身是否正確** —— 如果解析伺服器本身被汙染（cache poisoning）或回傳偽造資料，加密通道照樣把錯誤答案安全地送達。

**DNSSEC — 保護「資料來源的真實性與完整性」**
- DNSSEC（DNS Security Extensions）對 DNS 紀錄加上**數位簽章**（RRSIG、DNSKEY、DS 等紀錄）。
- 解析器收到回應後，可沿著「信任鏈（Chain of Trust）」從根區（root）逐層驗證簽章，確認這筆紀錄**確實來自該網域的授權來源、且未被竄改**。
- **解決的問題**：防止 DNS 快取毒化、回應偽造（spoofing）—— 即使攻擊者攔截並偽造回應，因無法產生有效簽章，驗證會失敗。
- **限制**：DNSSEC **不加密**。查詢與回應內容仍是明文，任何人都看得到使用者查了什麼網域。它只保證「答案沒被竄改」，不保證「沒人偷看」。

**互補關係總結**

| 面向 | DoH/DoT | DNSSEC |
|---|---|---|
| 機密性（防竊聽） | ✔ 加密通道 | ✗ 不提供 |
| 完整性（傳輸途中） | ✔ TLS 保證 | ✔ 簽章保證 |
| 來源真實性（資料本身） | ✗ 不驗證 | ✔ 信任鏈驗證 |
| 防快取毒化 | ✗ | ✔ |
| 保護範圍 | 用戶端 → 解析器 | 端到端（含權威伺服器） |

**企業實務建議**：兩者應**併用**。以 DoH/DoT 加密用戶到企業內部解析器的查詢（防內網竊聽、防員工查詢被外洩）；以 DNSSEC 確保解析器收到的權威回應是真實的（防被導向釣魚網站）。一個管「不被偷看與中途竄改」，一個管「答案是不是真的」，合起來才是完整的 DNS 安全。`,

    {

      question: `請就以下 10 種面向：位址長度、位址型態、位址派發、標頭(Header)大小、鄰居探索、分片(Fragmentation)、QoS 標記欄位、總長度欄位、DNS 解析、行動(Mobility)路由模式，比較 IPv6 及 IPv4 之異同。（10分）`,
      answer: `| 面向 | IPv4 | IPv6 |
|---|---|---|
| **位址長度** | 32 位元（約 43 億個位址） | 128 位元（約 3.4×10³⁸ 個位址） |
| **位址型態** | Unicast、Multicast、Broadcast | Unicast、Multicast、Anycast（**取消 Broadcast**，改用 multicast 達成廣播效果） |
| **位址派發** | 手動設定、DHCP | 手動、DHCPv6、**SLAAC（無狀態位址自動設定）**—主機可依路由器通告（RA）自行產生位址 |
| **標頭大小** | 可變長度（20–60 bytes，含選項欄位） | **固定 40 bytes** 基本標頭，額外功能改用「延伸標頭（Extension Header）」串接，加快路由器處理 |
| **鄰居探索** | 使用 **ARP**（廣播）解析 MAC | 使用 **NDP（Neighbor Discovery Protocol）**，基於 ICMPv6 + multicast，並含路由器探索、位址自動設定 |
| **分片** | 路由器與來源端皆可分片 | **僅來源端可分片**，路由器不分片；改由來源端先做 Path MTU Discovery |
| **QoS 標記欄位** | ToS（Type of Service）欄位 | **Traffic Class** + **Flow Label（流標籤）** 欄位，可標記同一資料流以利特殊處理 |

| **DNS 解析** | 使用 **A 紀錄**（IPv4 位址） | 使用 **AAAA 紀錄**（IPv6 位址）；反解網域為 ip6.arpa |
| **行動路由模式** | Mobile IPv4，需「三角繞送」經 Home Agent，效率較差 | Mobile IPv6，支援**路由最佳化（Route Optimization）**，通訊對端可直接與行動節點通訊，免三角繞送 |

**重點異同總結**
- **相同點**：兩者皆為網路層協定、皆採無連線（connectionless）封包傳遞、皆有 TTL（IPv6 改稱 Hop Limit）概念。
- **最大差異**：IPv6 透過固定標頭 + 延伸標頭、取消路由器分片、取消廣播等設計，大幅簡化路由器負擔、提升轉送效率，並以 128 位元徹底解決位址耗盡問題。`,

    {
      id: "114-4", no: "四", topic: "prog", topicName: "程式設計實作",
      title: "快樂數判斷 isHappy(int n)",
      score: 15,
      question: `定義「快樂數」為一個正整數 N 經過以下過程：
1. 將 N 的每一位數字平方後相加，得到新數字。例如：25 → 2×2+5×5=29
2. 重複此步驟，直到出現下述其中一種結果：
   ① 得到 1，則 N 是快樂數
   ② 進入循環（例如：4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4），則 N 非屬快樂數
請設計一函式 isHappy(int n)，並註明所使用的程式語言：（15分）
輸入：正整數 n (1 ≤ n ≤ 10⁹)
輸出：若 n 是快樂數，回傳 true；否則回傳 false`,
      answer: `**解題思路**

關鍵在於「如何偵測循環」。若不是快樂數，數字必定會進入一個重複的循環。有兩種經典做法：

1. **HashSet 法**：把出現過的數字存進集合，若再次出現代表進入循環 → 回傳 false；若變成 1 → 回傳 true。
2. **快慢指針法（Floyd 龜兔賽跑）**：慢指針每次走 1 步、快指針每次走 2 步。若有循環兩者必相遇；若快指針追到 1 代表是快樂數。優點是空間複雜度 O(1)。

下方用 C 語言示範。數字平方和有上界（10⁹ 最多 10 位，每位 9²=81，總和最多 810），所以平方和很快會落到 1000 以內 —— 因此「解法一」可用一個大小 1000 的標記陣列代替 HashSet 來偵測循環。「解法二」快慢指針法則完全不需額外空間。`,
      code: {
        lang: "c",
        text: `// 程式語言：C

#include <stdio.h>
#include <stdbool.h>
#include <string.h>

// 輔助函式：計算各位數字平方和
int squareSum(int n) {
    int sum = 0;
    while (n > 0) {
        int digit = n % 10;      // 取出個位數
        sum += digit * digit;    // 平方後累加
        n /= 10;                 // 去掉個位數
    }
    return sum;
}

// 解法一：用標記陣列偵測循環（取代 HashSet）
// 平方和很快收斂到 1000 以內，故陣列大小 1000 已足夠
bool isHappy(int n) {
    bool seen[1000];
    memset(seen, false, sizeof(seen));   // 初始化標記陣列
    while (n != 1) {
        if (n < 1000 && seen[n])         // 此數出現過 → 進入循環
            return false;
        if (n < 1000) seen[n] = true;    // 記錄出現過的數字
        n = squareSum(n);                // 產生下一個數字
    }
    return true;                         // 停在 1 即為快樂數
}

// 解法二：快慢指針法（Floyd 龜兔賽跑，空間 O(1)）
bool isHappyFloyd(int n) {
    int slow = n;
    int fast = squareSum(n);
    while (fast != 1 && slow != fast) {
        slow = squareSum(slow);              // 慢指針走 1 步
        fast = squareSum(squareSum(fast));   // 快指針走 2 步
    }
    return fast == 1;
}

int main() {
    printf("%d\\n", isHappy(19));      // 1 (true)  19→82→68→100→1
    printf("%d\\n", isHappy(2));       // 0 (false) 進入 4 的循環
    printf("%d\\n", isHappyFloyd(7));  // 1 (true)
    return 0;
}`

| 比較項 | 基本型別 Primitive | 參考型別 Reference |
|---|---|---|
| 種類 | byte, short, int, long, float, double, char, boolean（共 8 種） | 類別、介面、陣列、String、包裝類別等 |
| 儲存內容 | 變數**直接儲存「值」本身** | 變數儲存的是**指向物件的「位址（參考）」**，物件本體在堆積（Heap） |

| 預設值 | 0 / 0.0 / false / '\\u0000' | null |
| 傳遞方式 | 傳值（pass-by-value），複製值 | 傳遞「參考的值」，複製的是位址，故可透過參考修改同一物件 |
| 是否可為 null | 不可 | 可 |

例：\`int a = 5;\` 變數 a 裡就是 5；\`String s = new String("hi");\` 變數 s 裡是一個位址，"hi" 物件在 Heap。

**(二) 垃圾回收機制（GC）（6分）**

*如何運作（3分）*
- JVM 自動管理 Heap 記憶體。GC 透過**可達性分析（Reachability Analysis）**，從「GC Roots」（如執行緒堆疊中的區域變數、靜態變數、JNI 參考）出發追蹤所有可被存取到的物件。
- **追蹤不到的物件 = 無人參考 = 垃圾**，其佔用的記憶體會被回收。
- 常見演算法：標記-清除（Mark-Sweep）、標記-整理（Mark-Compact）、複製（Copying）。
- 現代 JVM 採**分代回收（Generational GC）**：Heap 分為新生代（Young，含 Eden + 兩個 Survivor）與老年代（Old）。新物件先放 Eden，多次回收後存活者晉升老年代。新生代用 Minor GC（快、頻繁），老年代用 Major/Full GC（慢）。

*何時觸發（3分）*
- 新生代 Eden 區空間不足時，觸發 **Minor GC**。
- 老年代空間不足、或晉升失敗時，觸發 **Major GC / Full GC**。
- 呼叫 \`System.gc()\` 時「建議」JVM 執行 GC（僅是建議，不保證立即執行）。
- 注意：GC 觸發時機由 JVM 自行決定，程式設計師**無法精確控制**。

- **Java 實現**：將實體變數宣告為 \`private\`，提供 \`public\` 的 getter/setter 方法存取，並在 setter 中加入驗證邏輯。
\`\`\`java
class Account {
    private double balance;            // 隱藏
    public double getBalance() { return balance; }
    public void deposit(double amt) {  // 受控存取
        if (amt > 0) balance += amt;
    }
}
\`\`\`

*2. 繼承（Inheritance）*
- **定義**：子類別承襲父類別的屬性與方法，達到程式碼重用，並可擴充或修改行為，形成「is-a」關係。

class Animal { void eat() { } }
class Dog extends Animal { void bark() { } }  // Dog 繼承 Animal
\`\`\`

  - 父類別參考指向子類別物件：\`Animal a = new Dog(); a.eat();\` 實際呼叫 Dog 版本。

\`\`\``,

JOIN Buy B ON A.pNo = B.pNo

      question: `請實作下列函式以完成設計 1 個插入排序法(Insertion Sort)，據以依參數值決定排序方式採遞增或遞減。（18分）
  bool isInverse(int x, int y, bool isAsc);  // 判斷傳入的 x、y 是否反序
  void InsertionSort(int *arr, int len, bool isAsc);  // 插入排序
（註：arr 為傳入整數陣列；len 為長度；isAsc 為是否遞增，InsertionSort 應呼叫 isInverse。）`,
      answer: `**解題思路**

插入排序：把陣列分成「已排序區」與「未排序區」，每次取未排序的第一個元素，往前比對插入到正確位置。

題目要求拆成兩個函式：
- \`isInverse(x, y, isAsc)\`：判斷 x、y 兩數是否「順序不對（反序）」。
  - 若 isAsc=true（要遞增），前面的 x 比後面的 y 大 → 反序。
  - 若 isAsc=false（要遞減），前面的 x 比後面的 y 小 → 反序。
- \`InsertionSort\` 在「往前比對」時呼叫 \`isInverse\` 判斷是否該繼續往前移。`,
      code: {
        lang: "c",
        text: `// 程式語言：C

#include <stdio.h>
#include <stdbool.h>

// 判斷 x、y 是否為「反序」（順序不符合期望）
// isAsc = true  → 期望遞增，x > y 即反序
// isAsc = false → 期望遞減，x < y 即反序
bool isInverse(int x, int y, bool isAsc) {
    if (isAsc)
        return x > y;
    else
        return x < y;
}

// 插入排序，依 isAsc 決定遞增或遞減
void InsertionSort(int *arr, int len, bool isAsc) {
    for (int i = 1; i < len; i++) {
        int key = arr[i];       // 取出未排序區第一個元素
        int j = i - 1;
        // 當 arr[j] 與 key 反序時，arr[j] 須往後移
        while (j >= 0 && isInverse(arr[j], key, isAsc)) {
            arr[j + 1] = arr[j];   // 後移一格
            j--;
        }
        arr[j + 1] = key;       // 將 key 放入正確位置
    }
}

int main() {
    int a[] = {5, 2, 9, 1, 7, 3};
    int n = 6;

    InsertionSort(a, n, true);   // 遞增排序
    printf("遞增：");
    for (int i = 0; i < n; i++) printf("%d ", a[i]);  // 1 2 3 5 7 9
    printf("\\n");

    InsertionSort(a, n, false);  // 遞減排序
    printf("遞減：");
    for (int i = 0; i < n; i++) printf("%d ", a[i]);  // 9 7 5 3 2 1
    printf("\\n");
    return 0;
}

/* 時間複雜度：最差/平均 O(n^2)，最佳（已排序）O(n)
   空間複雜度：O(1)，為穩定排序 */`

      answer: `**解題思路（關鍵數學洞察）**

「一個正整數恰好有 3 個因數」是非常特殊的條件。

設 N = |a−b|。若 N 的質因數分解為 p₁^e₁ × p₂^e₂ × …，則因數個數 = (e₁+1)(e₂+1)…

要讓因數個數 = 3（質數），唯一可能是 **(e+1) = 3，即 e = 2，且只有一個質因數**。

➡ **結論：N 恰有 3 個因數 ⟺ N 是某個質數的平方（N = p²）**。
   此時 3 個因數為 1、p、p²。

例：9 = 3² → 因數 {1,3,9}；25 = 5² → {1,5,25}；49 = 7² → {1,7,49}。
反例：16 = 2⁴ → 因數 {1,2,4,8,16} 共 5 個（不符）。

**演算法（符合「只能呼叫平方根函式」限制）**
1. 計算 N = |a−b|。
2. 取 r = round(sqrt(N))，檢查 r×r 是否等於 N（N 是否為完全平方數）。若不是 → 回傳 false。
3. 若是，再檢查 r 是否為質數。判斷質數需試除到 √r —— 此處同樣只用到 sqrt 函式。
4. r 為質數 → N = r² 恰有 3 個因數 → true；否則 false。

時間複雜度：質數判斷 O(√r) = O(N^(1/4))，N ≤ 2³⁰ 時 r ≤ 2¹⁵，√r ≤ 2^7.5 ≈ 181，極快。`,

#include <stdio.h>
#include <math.h>
#include <stdbool.h>

// 判斷 r 是否為質數（試除到 sqrt(r)）
bool isPrime(long long r) {
    if (r < 2) return false;
    if (r == 2) return true;
    if (r % 2 == 0) return false;
    long long limit = (long long) sqrt((double) r);
    for (long long i = 3; i <= limit; i += 2) {
        if (r % i == 0) return false;
    }
    return true;
}

// 判斷 |a-b| 是否恰有 3 個因數
// 數學原理：恰有 3 個因數 ⟺ 該數為某質數的平方 (p^2)
bool hasThreeDivisors(long long a, long long b) {
    long long n = (a > b) ? (a - b) : (b - a);  // N = |a-b|
    if (n < 4) return false;   // 最小的 p^2 為 4 (=2^2)

    // 步驟1：檢查 N 是否為完全平方數
    long long r = (long long) round(sqrt((double) n));
    // 修正浮點誤差，於 r-1, r, r+1 中尋找
    while (r * r > n) r--;
    while ((r + 1) * (r + 1) <= n) r++;
    if (r * r != n) return false;   // 不是完全平方數

    // 步驟2：檢查平方根 r 是否為質數
    return isPrime(r);
}

int main() {

    printf("%d\\n", hasThreeDivisors(30, 5));   // N=25=5^2 → 1 (true)
    printf("%d\\n", hasThreeDivisors(20, 4));   // N=16     → 0 (false, 5個因數)
    printf("%d\\n", hasThreeDivisors(15, 3));   // N=12     → 0 (false)
    return 0;
}`

2. **PaaS（平台即服務）**：CSP 提供應用程式的開發、測試、佈署平台（含 OS、執行環境、資料庫），使用者專注於開發與管理自己的應用。
3. **SaaS（軟體即服務）**：CSP 提供完整的應用軟體，使用者透過網路（瀏覽器）直接使用，無需管理任何底層設施。

**(二) 雲端服務的 4 種部署模型（8分）**

1. **公有雲（Public Cloud）**：資源由 CSP 擁有並對一般大眾開放，多租戶共用。優點為彈性、低成本；資安與隱私控制度較低。
2. **私有雲（Private Cloud）**：基礎設施專供「單一組織」使用，可自建或委外。控制力與安全性高、成本較高。
3. **社群雲 / 共同體雲（Community Cloud）**：由「具共同需求或關注（如相同法規、任務）的多個組織」共享，例如政府機關間共用雲。
4. **混合雲（Hybrid Cloud）**：結合上述兩種以上模型，各自獨立但以技術整合，可在私有雲處理敏感資料、公有雲處理彈性負載。

      answer: `**(一) 安全性威脅類型（3分）**

此程式有 **緩衝區溢位（Buffer Overflow）** 弱點，根源在於使用了不安全的 \`gets()\` 函式。\`gets()\` 不檢查輸入長度，會持續讀取直到換行，輸入超過緩衝區大小時即溢位。

**(二) 危害與運作原理（6分）**

*運作原理*：
- \`username[16]\`、\`password[16]\` 是固定大小的區域變數，配置在「堆疊（Stack）」上。
- 堆疊上除了區域變數，還存有 **函式返回位址（Return Address）**、堆疊框指標等控制資訊。
- 當使用者對 \`gets()\` 輸入超過 16 bytes 的字串，多出的資料會「覆蓋」相鄰記憶體 —— 先覆蓋其他變數，再覆蓋返回位址。

*造成的危害*：
1. **程式崩潰（DoS）**：返回位址被亂數覆蓋，函式返回時跳到無效位址，程式當掉。
2. **繞過驗證**：精心構造的輸入可覆蓋 password 變數或控制流程，使驗證條件失效。
3. **任意程式碼執行（最嚴重）**：攻擊者將返回位址覆蓋為自己注入的「惡意機器碼（shellcode）」位址，函式返回時即跳去執行攻擊者的指令，可取得系統控制權 —— 這正是題目所說「執行不被允許的指令」。

}

      answer: `**(一) 何謂 Stack（3分）**

堆疊（Stack）是一種「**後進先出（LIFO, Last-In-First-Out）**」的線性資料結構。所有的新增（push）與刪除（pop）操作都只在同一端「堆疊頂端（top）」進行。最後放入的元素，會最先被取出。

主要操作：push（壓入）、pop（彈出）、peek/top（查看頂端）、isEmpty（是否為空）、isFull（是否已滿，陣列實作時）。

**(二) Stack 的 2 個實際應用案例（6分）**

1. **函式呼叫堆疊（Call Stack）**：程式執行時，每呼叫一個函式就把該函式的「堆疊框（區域變數、參數、返回位址）」push 進呼叫堆疊；函式結束時 pop 出來，回到呼叫點。遞迴能正確運作，正是靠這個 LIFO 機制。

2. **運算式求值 / 括號匹配**：
   - 中序轉後序、後序運算式求值都用 stack 暫存運算元與運算子。
   - 編輯器檢查括號是否成對：遇到左括號 push，遇到右括號 pop 出來比對是否匹配。

   其他常見應用：瀏覽器「上一頁」歷史、文書軟體「復原（Undo）」功能、深度優先搜尋（DFS）。

**(三) Stack 程式實作（6分）**`,

        lang: "c",
        text: `// 程式語言：C（陣列方式實作 Stack）

#include <stdio.h>
#include <stdbool.h>

#define MAX 100

typedef struct {
    double data[MAX];
    int top;              // 指向堆疊頂端，-1 表示空
} FloatStack;

// 初始化
void initStack(FloatStack *s) {
    s->top = -1;
}

// 檢測 stack 是否為空
bool isEmpty(FloatStack *s) {
    return s->top == -1;
}

// 檢測 stack 是否已滿
bool isFull(FloatStack *s) {
    return s->top == MAX - 1;
}

// 壓入元素
void push(FloatStack *s, double value) {
    if (isFull(s)) {
        printf("Stack 已滿\\n");
        return;
    }
    s->data[++(s->top)] = value;
}

// 彈出元素
double pop(FloatStack *s) {
    if (isEmpty(s)) {
        printf("Stack 已空，無法彈出\\n");
        return 0.0;
    }
    return s->data[(s->top)--];
}

int main() {
    FloatStack s;
    initStack(&s);

    // 依序插入 4 個浮點數
    double nums[] = {20.22, 12.21, 70.25, 58.29};
    for (int i = 0; i < 4; i++) {
        push(&s, nums[i]);
        printf("push: %.2f\\n", nums[i]);
    }

    // 逐一移除，並檢測是否為空
    printf("--- 開始移除 (LIFO) ---\\n");
    while (!isEmpty(&s)) {
        printf("pop : %.2f\\n", pop(&s));
    }
    printf("Stack 是否為空？ %s\\n", isEmpty(&s) ? "是" : "否");
    return 0;
}

/* 輸出順序：
   push 20.22, 12.21, 70.25, 58.29
   pop  58.29 → 70.25 → 12.21 → 20.22  (後進先出)
   最後 isEmpty() = 是                              */`

// 編譯：gcc clean.c -lsqlite3 -o clean

#include <stdio.h>
#include <string.h>
#include <ctype.h>
#include <stdbool.h>
#include <sqlite3.h>

// 去除字串前後空白（就地修改）
void trim(char *s) {
    int i = 0, j = strlen(s) - 1;
    while (isspace((unsigned char)s[i])) i++;
    while (j >= i && isspace((unsigned char)s[j])) j--;
    int k = 0;
    while (i <= j) s[k++] = s[i++];
    s[k] = '\\0';
}

// 檢查字串是否「長度為 len 且全為數字」
bool allDigits(const char *s, int len) {
    if ((int)strlen(s) != len) return false;
    for (int i = 0; i < len; i++)
        if (!isdigit((unsigned char)s[i])) return false;
    return true;
}

int main() {
    sqlite3 *db;
    sqlite3_open("user.db", &db);          // 連線資料庫

    // === Load 準備：首次寫入先建立 user_data 資料表 ===
    const char *createSQL =
        "CREATE TABLE IF NOT EXISTS user_data ("
        "user_id TEXT PRIMARY KEY, name TEXT, age INTEGER,"
        "address TEXT, email TEXT, phone TEXT);";
    sqlite3_exec(db, createSQL, 0, 0, 0);

    FILE *fp = fopen("data.txt", "r");
    if (!fp) { printf("無法開啟檔案\\n"); return 1; }

    char line[512];

        if (strlen(line) == 0) continue;

        // 以逗號切出 6 個欄位
        char *f[6]; int n = 0;
        char *tok = strtok(line, ",");
        while (tok && n < 6) { f[n++] = tok; tok = strtok(NULL, ","); }

        // === Transform：規則1 — 須恰有 6 個欄位，否則丟棄 ===
        if (n != 6) continue;
        char uid[64], name[128], age[32], addr[256], email[128], phone[64];
        strcpy(uid, f[0]);  strcpy(name, f[1]); strcpy(age, f[2]);
        strcpy(addr, f[3]); strcpy(email, f[4]); strcpy(phone, f[5]);

        // 規則2：清除姓名、地址多餘空格
        trim(name); trim(addr); trim(uid); trim(age); trim(email); trim(phone);

        // 規則3：email 轉小寫

        // 規則4：使用者號碼須為 8 位數字
        if (!allDigits(uid, 8)) continue;

        // 規則5：年齡須為合法正整數
        bool ageOK = strlen(age) > 0;
        for (int i = 0; age[i]; i++)
            if (!isdigit((unsigned char)age[i])) ageOK = false;
        if (!ageOK || atoi(age) <= 0) continue;

        // 規則6：手機須為 10 位、09 開頭
        if (!allDigits(phone, 10) || phone[0] != '0' || phone[1] != '9')
            continue;

        // 缺欄位（空字串）也丟棄
        if (strlen(name) == 0 || strlen(addr) == 0 || strlen(email) == 0)
            continue;

        // === Load：以參數化方式寫入資料庫，防 SQL Injection ===
        sqlite3_stmt *stmt;
        sqlite3_prepare_v2(db,
            "INSERT OR REPLACE INTO user_data VALUES(?,?,?,?,?,?);",
            -1, &stmt, 0);
        sqlite3_bind_text(stmt, 1, uid,   -1, SQLITE_STATIC);
        sqlite3_bind_text(stmt, 2, name,  -1, SQLITE_STATIC);
        sqlite3_bind_int (stmt, 3, atoi(age));
        sqlite3_bind_text(stmt, 4, addr,  -1, SQLITE_STATIC);
        sqlite3_bind_text(stmt, 5, email, -1, SQLITE_STATIC);
        sqlite3_bind_text(stmt, 6, phone, -1, SQLITE_STATIC);
        sqlite3_step(stmt);
        sqlite3_finalize(stmt);
        count++;
    }

    fclose(fp);
    printf("成功寫入 %d 筆有效記錄\\n", count);
    sqlite3_close(db);
    return 0;
}`

(二) 使用 SQL 萬用字元(Wildcards)列出供應商名稱及城市名稱，其城市名稱第 2 個字母包含 a, e, i。（5分）
(三) 使用 SQL EXISTS 語法列出產品價格 > 100 的供應商名稱。（7分）`,
      answer: `**(一) 雙重排序（3分）**
\`\`\`sql
SELECT S.SupplierName, P.ProductName
FROM Suppliers S
JOIN Products P ON S.SupplierID = P.SupplierID
ORDER BY S.SupplierID ASC, P.ProductID DESC;
\`\`\`

**(二) 萬用字元 — 城市名稱第 2 個字母為 a/e/i（5分）**

SQL 萬用字元：\`_\` 代表任意「單一」字元、\`%\` 代表任意「多個」字元、\`[...]\` 代表字元集合（SQL Server）。
「第 2 個字母為 a、e 或 i」= 第 1 字任意、第 2 字屬於 {a,e,i}、之後任意。
\`\`\`sql
-- SQL Server 寫法（支援 [] 字元集合）
SELECT SupplierName, City
FROM Suppliers
WHERE City LIKE '_[aei]%';

-- 通用寫法（不支援 [] 時，用 OR 列舉）
SELECT SupplierName, City
FROM Suppliers
WHERE City LIKE '_a%'
   OR City LIKE '_e%'
   OR City LIKE '_i%';
\`\`\`
說明：\`_\` 佔住第 1 個字元，\`[aei]\` 限定第 2 個字元，\`%\` 涵蓋其餘。

**(三) EXISTS 列出有產品價格 > 100 的供應商（7分）**

EXISTS 為「存在性檢查」：對外層每一筆供應商，檢查內層是否「存在」其價格 > 100 的產品。
\`\`\`sql
SELECT S.SupplierName
FROM Suppliers S
WHERE EXISTS (
    SELECT 1
    FROM Products P
    WHERE P.SupplierID = S.SupplierID
      AND P.Price > 100
);
\`\`\`
重點：內層子查詢以 \`P.SupplierID = S.SupplierID\` 與外層關聯（correlated subquery）。EXISTS 只要找到「一筆」符合就回傳真，效率較 IN 佳，且自動去除重複供應商。`,

      question: `目前機器學習實務上主要應用的學習方式為監督式學習及非監督式學習，請分別說明其定義、主要處理問題及常見的演算法。（15分）`,
      answer: `**監督式學習（Supervised Learning）**

- **定義**：使用「**已標記（labeled）**」的訓練資料 —— 每筆資料同時有輸入特徵（X）與正確答案（Y）。模型學習從 X 到 Y 的對應關係，目標是對新資料做出準確預測。
- **主要處理問題**：
  - **分類（Classification）**：預測「離散類別」。例：垃圾郵件判別、疾病診斷、影像辨識。
  - **迴歸（Regression）**：預測「連續數值」。例：房價預測、銷售量預測、氣溫預測。
- **常見演算法**：線性迴歸、邏輯迴歸、決策樹、隨機森林、支援向量機（SVM）、K 最近鄰（KNN）、神經網路、單純貝氏（Naive Bayes）。

**非監督式學習（Unsupervised Learning）**

(一) 請以遞迴(Recursive)方式寫出程式碼。

(三) 為避免遞迴呼叫浪費重複計算的時間，試修改(一)的程式碼，仍須使用遞迴方式，使其不須重複計算 F(n-1) 和 F(n-2)。`,
      answer: `**解題思路**

(一) 純遞迴：直接照定義寫，但 F(n-1) 與 F(n-2) 會被重複計算，時間複雜度高達 O(2ⁿ)。
(二) 非遞迴：用迴圈由小往大累加，只需兩個變數記住前兩項，時間 O(n)、空間 O(1)。
(三) 記憶化遞迴（Memoization）：仍用遞迴，但用陣列把算過的結果「快取」起來，下次直接查表，時間降為 O(n)。`,

        lang: "c",
        text: `// 程式語言：C

#include <stdio.h>

/* === (一) 遞迴方式 ===
   缺點：F(n-1)、F(n-2) 重複計算，時間複雜度 O(2^n) */
int fibRecursive(int n) {
    if (n == 0) return 0;
    if (n == 1) return 1;
    return fibRecursive(n - 1) + fibRecursive(n - 2);
}

/* === (二) 非遞迴（迴圈）方式 ===
   時間 O(n)、空間 O(1) */
int fibIterative(int n) {
    if (n == 0) return 0;
    if (n == 1) return 1;
    int prev2 = 0, prev1 = 1, cur;
    for (int i = 2; i <= n; i++) {
        cur = prev1 + prev2;   // 當前項 = 前兩項之和
        prev2 = prev1;
        prev1 = cur;
    }
    return prev1;
}

/* === (三) 記憶化遞迴（Memoization）===
   仍用遞迴，但以 memo 陣列快取已算過的值，避免重複計算
   時間降為 O(n) */
#define MAX 100
int memo[MAX];

int fibMemo(int n) {
    if (n == 0) return 0;
    if (n == 1) return 1;
    if (memo[n] != -1)         // 已算過 → 直接回傳快取值
        return memo[n];
    memo[n] = fibMemo(n - 1) + fibMemo(n - 2);  // 算完存入快取
    return memo[n];
}

int main() {
    int n = 10;

    printf("(一) 遞迴      F(%d) = %d\\n", n, fibRecursive(n));
    printf("(二) 非遞迴    F(%d) = %d\\n", n, fibIterative(n));

    for (int i = 0; i < MAX; i++) memo[i] = -1;  // 初始化快取
    printf("(三) 記憶化遞迴 F(%d) = %d\\n", n, fibMemo(n));
    // 三者結果皆為 55
    return 0;
}`

      question: `快速排序法(Quick Sort)是排序演算中的一種，處理過程是先選擇一個資料為基準點，所有比基準點小的元素放在左邊，比基準點大的元素放在右邊，之後再反覆對基準點左右兩邊的數列執行相同處理，直到數列只剩一個數值或沒有數值時即完成排序。請撰寫一函式 QuickSort()，將傳入的一維陣列利用快速排序法由小至大排序。（20分）`,
      answer: `**解題思路**

快速排序是「分治法（Divide and Conquer）」的典型應用：
1. **選基準（pivot）**：選一個元素為基準點。
2. **分割（partition）**：把比 pivot 小的放左、大的放右，pivot 歸位到正確位置。
3. **遞迴**：對左半部與右半部分別重複上述步驟。
4. 當子陣列長度 ≤ 1 時停止。

時間複雜度：平均 O(n log n)，最差（已排序且選端點為 pivot）O(n²)，空間 O(log n)（遞迴堆疊）。`,

        lang: "c",
        text: `// 程式語言：C

#include <stdio.h>

// 交換兩元素
void swap(int *a, int *b) {
    int t = *a; *a = *b; *b = t;
}

// 分割函式：以 arr[high] 為基準，回傳基準歸位後的索引
int partition(int *arr, int low, int high) {
    int pivot = arr[high];     // 選最右元素為基準
    int i = low - 1;           // i 指向「小於 pivot 區」的尾端
    for (int j = low; j < high; j++) {
        if (arr[j] < pivot) {  // 比基準小 → 換到左區
            i++;
            swap(&arr[i], &arr[j]);
        }
    }
    swap(&arr[i + 1], &arr[high]);  // 基準歸位
    return i + 1;
}

// 快速排序主函式
void QuickSort(int *arr, int low, int high) {
    if (low < high) {                       // 子陣列長度 > 1 才處理
        int p = partition(arr, low, high);  // p 為基準歸位處
        QuickSort(arr, low, p - 1);         // 遞迴排序左半
        QuickSort(arr, p + 1, high);        // 遞迴排序右半
    }
}

int main() {
    int arr[] = {30, 5, 37, 2, 61, 8, 55, 19, 46, 23};
    int n = sizeof(arr) / sizeof(arr[0]);

    QuickSort(arr, 0, n - 1);

    printf("排序結果：");
    for (int i = 0; i < n; i++) printf("%d ", arr[i]);
    // 2 5 8 19 23 30 37 46 55 61
    printf("\\n");
    return 0;
}

int adultCount(int n) {

正確流程：
1. 嘗試 \`lock()\` 鎖定該服務的號碼變數。
2. 若鎖定失敗 → 計數 +1、\`sleep()\` 稍候、重試；失敗次數超過上限 → 回傳 0。
3. 鎖定成功後（臨界區）：用 \`get()\` 讀目前號碼 → 加 1 → \`set()\` 寫回 → 記下要回傳的新號碼。
4. \`unlock()\` 解鎖。
5. 回傳新號碼。

int  lock(int serviceid);
void unlock(int serviceid);
int  get(int serviceid);
void set(int serviceid, int value);
void sleep(void);

/*
 * GetNumber：取得指定服務的下一個號碼
 * 參數 serviceid : 服務代碼
 * 參數 maxFail   : 鎖定失敗的上限次數
 * 回傳           : 下一個號碼；鎖定失敗超過上限時回傳 0
 */
int GetNumber(int serviceid, int maxFail) {
    int failCount = 0;

    // 嘗試鎖定，失敗則重試
    while (lock(serviceid) == 0) {     // 鎖定失敗
        failCount++;
        if (failCount > maxFail) {     // 失敗次數超過上限
            return 0;
        }
        sleep();                       // 暫停 0.1 秒後重試
    }

    // === 進入臨界區（已成功鎖定）===
    int current = get(serviceid);      // 讀取目前號碼
    int next = current + 1;            // 下一個號碼
    set(serviceid, next);              // 寫回新號碼
    // === 離開臨界區 ===

    unlock(serviceid);                 // 解鎖

    return next;                       // 回傳新號碼
}`

#include <stdlib.h>   // abs()

// 外部提供的函式
int getqueue(void);              // 無資料回傳 999
int getcurfloor(int elevid);     // 不提供服務回傳 999

/*
 * SelElev：選取離目標樓層最近的電梯
 * 參數 totalElev : 電梯總數 N（電梯號碼為 1..N）
 * 回傳           : 最近電梯號碼；未選到時回傳 0
 */
int SelElev(int totalElev) {
    // 取得目標樓層
    int target = getqueue();
    if (target == 999) {          // Queue 中無資料
        return 0;
    }

    int bestElev = 0;             // 最佳電梯號碼，0 表示尚未選到
    int minDist  = 999999;        // 目前最小距離

    // 逐一檢查每台電梯
    for (int id = 1; id <= totalElev; id++) {
        int floor = getcurfloor(id);
        if (floor == 999) {       // 此電梯不提供服務 → 略過
            continue;
        }
        // 距離 = |電梯樓層 - 目標樓層|，abs 可正確處理地下樓層負數
        int dist = abs(floor - target);
        if (dist < minDist) {     // 找到更近的電梯
            minDist  = dist;
            bestElev = id;
        }
    }

    return bestElev;              // 無可用電梯時 bestElev 仍為 0
}`

**(二) 反正規化的意義與作法（5分）**

*意義*：反正規化（De-normalization）是「刻意」違反正規化原則，將已正規化的資料表「合併」或「加入冗餘欄位」，目的是**提升查詢效能**。完全正規化雖能消除資料異常、減少冗餘，但查詢時需大量 JOIN，在讀取頻繁的系統（如資料倉儲、報表）會造成效能瓶頸。

*作法*：
1. **合併資料表**：將經常一起查詢、需 JOIN 的表合併為一張，減少 JOIN 次數。
2. **加入冗餘欄位**：在表中重複存放他表的常用欄位（如訂單明細直接存「品名」），免去查詢時 JOIN。
3. **預先計算衍生欄位**：直接儲存彙總值或計算結果（如直接存「複價」、「訂單總額」），免去即時運算。

*代價*：增加儲存空間、產生資料異常風險（更新時須同步多處），故適用於「讀多寫少」、對查詢效能要求高的場景，並需配套機制維持資料一致性。`,

PaaS 是雲端運算的服務模式之一，雲端服務提供者提供完整的「應用程式開發與佈署平台」，包含作業系統、執行環境、資料庫、中介軟體、開發工具等。開發者只需專注於撰寫與管理自己的應用程式，無需採購與維護底層硬體與基礎軟體。

特性：加速開發、降低基礎設施維護負擔、易於擴充。實例：Google App Engine、Microsoft Azure App Service、Heroku。

**(二) 推播技術（Push Technology）（5分）**

推播技術指「由伺服器主動將資訊傳送給用戶端」的通訊模式，與傳統「由用戶端主動向伺服器要求（Pull）」相反。伺服器一旦有新資訊（訊息、通知、更新）即主動推送，用戶端無需不斷輪詢（polling）。

優點：即時性高、減少不必要的網路請求、節省用戶端資源。應用：手機 App 通知、即時訊息、新聞快訊、電子郵件推播。技術如 WebSocket、Server-Sent Events、行動推播服務（FCM、APNs）。

**(三) 區塊鏈（Block Chain）（5分）**

區塊鏈是一種「去中心化的分散式帳本（Distributed Ledger）」技術。資料以「區塊（block）」為單位儲存，每個區塊包含交易資料、時間戳記，以及「前一個區塊的雜湊值」，使所有區塊以雜湊鏈結成鏈。

      question: `進階持續性威脅(Advanced Persistent Threats, APT)係針對特定組織所作的複雜且多方位的網路攻擊。（2題，共20分）

      answer: `**(一) APT 攻擊流程（15分）**

APT 是針對「特定目標」、由具組織與資源的攻擊者發動、長期潛伏的精密攻擊。典型流程（參考 Cyber Kill Chain）：

1. **偵察（Reconnaissance）**：蒐集目標組織情報 —— 員工資訊、網路架構、使用的系統與軟體、社群媒體足跡，找出可下手的弱點。

2. **入侵 / 初始滲透（Initial Compromise）**：透過「魚叉式釣魚郵件（Spear Phishing）」、惡意附件、水坑攻擊（Watering Hole）、利用零時差漏洞等手法取得初始立足點。

3. **建立據點（Establish Foothold）**：在受害主機植入惡意程式 / 後門（Backdoor），建立與「命令控制伺服器（C&C/C2）」的連線通道，確保可持續控制。

4. **提升權限（Privilege Escalation）**：利用系統漏洞或竊取的帳號密碼，取得更高權限（管理者、網域管理員）。

5. **內部偵察 / 橫向移動（Lateral Movement）**：在內網中探索、移動，從一台主機跳到另一台，逐步逼近存放關鍵資料的目標系統。

6. **維持存取 / 長期潛伏（Maintain Persistence）**：建立多重後門與隱蔽通道，即使部分被發現仍能維持控制，長期潛伏（數月甚至數年）而不被察覺。

7. **資料竊取 / 達成目標（Exfiltration）**：蒐集、壓縮、加密目標資料，分批、低調地外傳到攻擊者伺服器，避免觸發異常流量警報。

8. **清除痕跡（Covering Tracks）**：刪除日誌、清理惡意程式痕跡，降低被偵測與追查的可能。

      answer: `**(一) 以 class A 說明（6分）**

*(1) 封裝（Encapsulation）（3分）*
封裝是將「資料」與「操作資料的方法」包裝在一起，並透過存取修飾子隱藏內部細節。
- 在 class A 中，\`private int a1\` 將變數 a1 宣告為私有，**外部無法直接存取** a1。
- 外界只能透過 \`public\` 方法 m1()、m2() 來「間接」修改 a1 的值。
- 這就是封裝：把 a1 隱藏起來，只開放受控的方法介面操作它，保護資料不被任意竄改。
- （對照：\`public int a0\` 未封裝，外部可直接存取。）

*(2) 繼承（Inheritance）（3分）*
繼承是子類別承襲父類別的成員，達成程式碼重用。
- \`class B extends A\` 表示 B 繼承 A。
- B 因此**自動擁有** A 的 public 成員：變數 a0、方法 m1()、m1(int)、m2()。
- 所以 B 的方法 m3() 中能直接使用 a0 與 m1()，即使 B 自己沒有定義它們 —— 這些是從 A 繼承來的。
- 注意：A 的 private 成員 a1 雖被繼承，但 B 不能直接存取（仍受封裝保護）。

**(二) 以 class A、class B 說明（4分）**

*(1) 覆寫（Overriding）（2分）*
覆寫指「子類別重新定義父類別中『相同簽章』的方法」。
- class A 有 \`public void m2()\`，class B 也定義了 \`public void m2()\`。
- 兩者方法名、參數列完全相同 → B 的 m2() **覆寫**了 A 的 m2()。
- 當以 B 物件呼叫 m2() 時，執行的是 B 的版本（b1=5; b2=2），而非 A 的版本。這是執行期的多型。

*(2) 超載（Overloading）（2分）*
超載指「同一類別中，多個『方法名相同但參數列不同』的方法」。
- class A 中有 \`m1()\`（無參數）與 \`m1(int x)\`（一個 int 參數）。
- 兩者方法名都是 m1，但參數列不同 → 構成**超載**。
- 編譯器依呼叫時傳入的引數，在編譯期決定要執行哪一個版本。`,

      question: `請於【待填入程式區塊】中以 6 行內為限填入虛擬程式碼，實現將二元樹中每一節點的左子樹、右子樹皆調換之功能。以 t 表示父節點指標、t->leftchild 表示左子節點指標、t->rightchild 表示右子節點指標。

      answer: `**解題思路**

要把二元樹「鏡像翻轉」—— 每個節點的左右子樹對調。這是遞迴的經典題：
1. 先把「當前節點」的左、右子指標互換（需用一個暫存變數）。
2. 再「遞迴」對左子樹、右子樹做同樣處理。
3. \`if (t <> NULL)\` 已是遞迴終止條件（空節點不處理）。

順序上「先換當前、再遞迴」或「先遞迴、再換當前」皆可，結果相同。

**待填入程式區塊（6 行內）**

\`\`\`
Swaptree(t pointer)
{
  if (t <> NULL) then
  {
    temp = t->leftchild;          // 暫存左子指標
    t->leftchild = t->rightchild; // 右子接到左邊
    t->rightchild = temp;         // 原左子接到右邊
    Swaptree(t->leftchild);       // 遞迴處理（已交換後的）左子樹
    Swaptree(t->rightchild);      // 遞迴處理（已交換後的）右子樹
  }
}  /* Swaptree 函式結尾 */
\`\`\`

**驗證**（以題目圖例）
- 交換前：A 的左 B（左 D）、右 C（左 E、右 F）
- 交換 A：左右互換 → A 的左 C、右 B
- 遞迴交換 C：C 的左 E、右 F 互換 → C 的左 F、右 E
- 遞迴交換 B：B 的左 D、右（空）互換 → B 的右 D
- 結果：A 左 C（左 F、右 E）、右 B（右 D）—— 與題目【圖2】一致。

      score: 25,
      question: `給定陣列 NUM，包含 n 個不重複整數(n>2)，請撰寫虛擬程式碼找出陣列中元素兩兩乘積最大者（maxprod = maximum(NUM[i]*NUM[j], i≠j)）。（2題，共25分）
(一) 請說明欲撰寫之虛擬程式碼的主要程式邏輯。（10分）
(二) 請在時間複雜度須為 O(n) 的限制下，撰寫虛擬程式碼。（15分）`,
      answer: `**(一) 主要程式邏輯（10分）**

*暴力法的問題*：用雙層迴圈檢查所有 i、j 配對，需 O(n²) 時間，不符要求。

*O(n) 的關鍵洞察*：陣列含「正數、負數」皆有可能。要使「兩數乘積」最大，只有兩種情況：
1. **最大的兩個正數相乘**（兩個最大值）→ 例 NUM={1,3,5} → 3×5=15。
2. **最小的兩個負數相乘**（兩個最小值，負負得正可能很大）→ 例 NUM={-8,-6,1,2} → (-8)×(-6)=48 > 1×2=2。

因此 **maxprod = max(最大值×次大值, 最小值×次小值)**。

*邏輯*：只需「掃描陣列一次」，同時記錄四個值：最大值 max1、次大值 max2、最小值 min1、次小值 min2。掃描結束後比較兩種乘積取較大者。整個過程只走訪陣列一遍 → O(n)。

**(二) O(n) 虛擬程式碼（15分）**

\`\`\`
Algorithm MaxPairwiseProduct(NUM, n)
  // 前提：n > 2，元素不重複
  Input : 陣列 NUM[0..n-1]，元素個數 n
  Output: 兩兩乘積最大值 maxprod

  // 初始化：max1≥max2 為最大兩數；min1≤min2 為最小兩數
  max1 ← -infinity ;  max2 ← -infinity
  min1 ← +infinity ;  min2 ← +infinity

  for i ← 0 to n-1 do
      x ← NUM[i]

      // --- 更新最大的兩個數 ---
      if x > max1 then
          max2 ← max1          // 原最大值降為次大
          max1 ← x
      else if x > max2 then
          max2 ← x

      // --- 更新最小的兩個數 ---
      if x < min1 then
          min2 ← min1          // 原最小值升為次小
          min1 ← x
      else if x < min2 then
          min2 ← x
  end for

  // 兩種候選：最大兩數相乘、最小兩數相乘（負負得正）
  prodMax ← max1 * max2
  prodMin ← min1 * min2
  maxprod ← maximum(prodMax, prodMin)

  return maxprod
End Algorithm
\`\`\`

**複雜度分析**：迴圈僅執行 n 次，每次迴圈內為固定數量的比較與指派（O(1)）→ 總時間複雜度 **O(n)**，空間複雜度 O(1)，符合題目要求。`,

      answer: `**(一) SQL 查詢（14分）**

*(1) 供應商名稱開頭為「台」（3分）*

FROM 供應商

*(2) 庫存為 0 的貨品，含供應商名稱與聯絡人（4分）*

JOIN 供應商 S ON G.供應商編號 = S.供應商編號

GROUP BY S.供應商編號, S.供應商名稱

*(3) 運作的優點（2分）*
冗餘存放供應商名稱也有好處：**查詢貨品時可直接取得供應商名稱，無需 JOIN 供應商表**，減少資料表連結運算，**提升查詢效能** —— 這正是「反正規化」的概念，在讀取頻繁的情境下可加快查詢速度。`,

(六) 何謂超荷(Overload)及覆寫(Override)？（4分）`,
      answer: `**(一) 單元測試（4分）**
單元測試（Unit Test）是針對程式中「最小可測試單元」（通常是單一函式、方法或類別）所進行的測試，驗證該單元在各種輸入下能否正確運作、產生預期結果。它是軟體測試的最底層，由開發者撰寫，特性是「隔離測試」（不受其他模組干擾）、可自動化、可重複執行，有助於及早發現缺陷、支援重構。

**(二) 同名異式與封裝（6分）**
- **同名異式 / 多型（Polymorphism）**：同一個介面或方法名稱，在不同情境下表現出不同行為。「一個介面、多種實作」。包含覆寫（執行期）與超載（編譯期）。例：父類別參考指向不同子類別物件，呼叫同名方法各自表現不同行為。
- **封裝（Encapsulation）**：將資料（屬性）與操作方法包裝在一起，並隱藏內部實作細節，只對外開放必要介面。透過 private 隱藏資料、public 方法控制存取，保護資料完整性。

**(三) 登入緩慢相關的資安特性（2分）**
與「**可用性（Availability）**」最相關。可用性指「授權使用者在需要時能即時、正常地存取系統與資料」。登入需 30 秒才回應代表系統反應遲緩、服務品質下降，可能是效能不足或遭受 DoS 攻擊，屬可用性受損。

**(四) 死結發生的條件（4分）**
死結（Deadlock）發生需「同時」滿足以下四個必要條件（Coffman 條件）：
1. **互斥（Mutual Exclusion）**：資源一次只能被一個程序佔用。
2. **持有並等待（Hold and Wait）**：程序持有至少一個資源，同時等待其他被佔用的資源。
3. **不可剝奪（No Preemption）**：資源不能被強制收回，只能由持有者自願釋放。
4. **循環等待（Circular Wait）**：存在一個程序的循環鏈，每個程序都在等待下一個程序所持有的資源。

*公式*：P(A∪B) = P(A) + P(B) − P(A∩B)

P(A|B) = P(A∩B) / P(B)
⟹ P(A∩B) = P(A|B) × P(B) = 0.3 × 0.2 = **0.06**

過度訓練（過度配適，Overfitting）指機器學習模型在「訓練資料」上表現極佳，但在「未見過的測試資料 / 新資料」上表現很差的現象。

| 項目 | 區域變數（Local Variable） | 靜態變數（Static Variable） |
|---|---|---|
| 定義 | 宣告於函式或區塊內部的變數 | 以 static 修飾、宣告於函式內的變數 |
| 作用範圍 | 僅限該函式 / 區塊內 | 僅限該函式內可見（同區域變數） |
| 生命週期 | 函式被呼叫時建立、函式結束即銷毀 | 程式「第一次執行到」時建立，**直到程式結束才銷毀** |
| 記憶體位置 | 堆疊（Stack） | 靜態 / 全域資料區 |
| 數值保留 | 每次呼叫重新初始化，不保留上次的值 | **跨呼叫保留數值**，下次呼叫延續上次結果 |
| 初始化 | 每次進入函式都重新初始化 | 只初始化一次 |

*差別重點*：兩者作用範圍相同（都只在函式內可見），但**生命週期不同** —— 區域變數隨函式生滅、不記憶；靜態變數存活整個程式期間、會記住上次的值。

      answer: `**(一) 4 種主流 NoSQL 資料庫類型（12分）**

1. **鍵值資料庫（Key-Value Store）**：以「鍵→值」儲存，結構最簡單，類似大型雜湊表。透過 key 存取極快，適合快取、Session、購物車。代表：Redis、DynamoDB、Memcached。

2. **文件資料庫（Document Store）**：以「文件」為單位儲存，格式為 JSON/BSON/XML，可有巢狀結構、欄位彈性。適合內容管理、半結構化資料。代表：MongoDB、CouchDB。

3. **欄位導向資料庫（Column-Family Store）**：資料以「欄族」組織，同欄資料連續儲存，適合大規模、寫入密集、欄位動態的應用。適合時序資料、日誌。代表：Cassandra、HBase、Bigtable。

4. **圖形資料庫（Graph Database）**：以「節點」與「關係」儲存，專為處理實體間複雜關聯設計。適合社交網路、推薦系統、詐欺偵測。代表：Neo4j、Amazon Neptune。

**(二) NoSQL 特性說明（8分）**

*(1) 增加機器就能自動擴充容量（4分）*
此為「**水平擴展（Horizontal Scaling / Scale-out）**」。傳統 RDB 多採垂直擴展（升級單機硬體），有上限且昂貴。NoSQL 採分散式架構，透過「**分片（Sharding）**」將資料切散到多台伺服器。需要更多容量時只要「加機器」，系統自動重新分配資料與負載，擴充近乎無上限、成本低。

*(2) 打破 Schema 欄位架構限制（4分）*
此為「**Schema-less / 動態結構**」。傳統 RDB 須先定義固定資料表結構，每筆資料都得符合。NoSQL（尤其文件型）不需預先定義固定結構，**同一集合中不同筆資料可有不同欄位**，新增欄位無需修改既有結構或停機，因應需求變動更敏捷。`,

      question: `以 PHP、JSP、ASP.NET 等程式語言開發網站時，常利用 Session、Cookie、POST Method、GET Method 儲存網頁資訊或傳遞參數，請說明其運作方式與特性（安全性、速度等）。（16分）`,
      answer: `HTTP 是「無狀態（stateless）」協定，每個請求彼此獨立。下列四種機制用來在請求間維持狀態或傳遞參數。

**1. Cookie**
- *運作*：伺服器以 \`Set-Cookie\` 標頭，將小段資料存到「使用者瀏覽器端」。之後該瀏覽器對同網站的每個請求都自動帶上此 Cookie。
- *特性*：資料存「用戶端」、容量小（約 4KB）、可設有效期限。**安全性低**：使用者可檢視竄改，不應存敏感資料；易遭 XSS 竊取 → 應加 HttpOnly、Secure。

**2. Session**
- *運作*：伺服器為每位使用者建立 Session，資料存「伺服器端」，產生唯一 Session ID，通常透過 Cookie 傳給瀏覽器辨識使用者。
- *特性*：資料存「伺服器端」、容量較大、可存敏感資訊。**安全性較高**：實際資料不外流。有時效性、會佔伺服器記憶體。

**3. GET Method**
- *運作*：將參數附加在 **URL 之後**（\`?name=value\`）傳送，用於「取得資料」。
- *特性*：參數**顯示在網址列**，會被書籤、紀錄、日誌記錄。**安全性低**，不可傳敏感資料。傳輸量小、**速度快**、可被快取，適合查詢。

**4. POST Method**
- *運作*：將參數放在 **HTTP 請求主體（body）** 中傳送，用於「提交資料」。
- *特性*：參數**不顯示在網址列**、安全性較 GET 高（仍須 HTTPS 才真正安全）、無資料量限制、可傳檔案、不被快取，適合會改變伺服器狀態的操作。

**綜合比較**

| 機制 | 資料位置 | 容量 | 安全性 | 用途 |
|---|---|---|---|---|
| Cookie | 用戶端 | 小 | 低 | 記偏好、Session ID |
| Session | 伺服器端 | 大 | 較高 | 登入狀態、敏感資料 |
| GET | URL | 小 | 低 | 取得資料、查詢 |
| POST | 請求主體 | 大 | 較高 | 提交、修改資料 |`,

      score: 24,
      question: `何謂環狀佇列(Circular Queue)（4分）？請使用 C、Java 等程式語言或虛擬碼以陣列(Array)方式實作環狀佇列，其中須包含新增與刪除佇列元素之方法（20分）。`,
      answer: `**何謂環狀佇列（4分）**

佇列（Queue）是「先進先出（FIFO）」結構。用「一般陣列」實作時，front 與 rear 指標只往後移，前端被刪除的空間無法再利用 —— rear 到陣列尾端就誤判為「滿」（假性溢位 false overflow）。

**環狀佇列**把陣列「頭尾相接」想像成一個環，指標移到尾端後可透過「對陣列大小取餘數（mod）」繞回開頭，重複利用前端釋放的空間，解決假性溢位。關鍵運算：\`rear = (rear+1) % SIZE\`、\`front = (front+1) % SIZE\`。

**判斷空/滿**：front 與 rear 重合時無法區分空滿，常見解法是「**犧牲一格**」：空 → \`front==rear\`；滿 → \`(rear+1)%SIZE==front\`，實際可存元素 = SIZE−1。`,
      code: {
        lang: "c",
        text: `// 程式語言：C — 環狀佇列（陣列實作）

#include <stdio.h>
#include <stdbool.h>
#define SIZE 5          // 陣列大小（實際可存 SIZE-1 = 4 個元素）

typedef struct {
    int data[SIZE];
    int front;          // 指向佇列前端的「前一格」
    int rear;           // 指向佇列尾端元素
} CircularQueue;

void initQueue(CircularQueue *q) { q->front = 0; q->rear = 0; }

bool isEmpty(CircularQueue *q) { return q->front == q->rear; }

// 滿：rear 下一格碰到 front（犧牲一格）
bool isFull(CircularQueue *q) { return (q->rear + 1) % SIZE == q->front; }

// 新增（enqueue）— 從 rear 端加入
bool enqueue(CircularQueue *q, int value) {
    if (isFull(q)) { printf("佇列已滿\\n"); return false; }
    q->rear = (q->rear + 1) % SIZE;   // rear 往後移，繞環
    q->data[q->rear] = value;
    return true;
}

// 刪除（dequeue）— 從 front 端移除
bool dequeue(CircularQueue *q, int *value) {
    if (isEmpty(q)) { printf("佇列已空\\n"); return false; }
    q->front = (q->front + 1) % SIZE; // front 往後移，繞環
    *value = q->data[q->front];
    return true;
}

int main() {
    CircularQueue q; initQueue(&q);
    enqueue(&q,10); enqueue(&q,20); enqueue(&q,30); enqueue(&q,40);
    enqueue(&q,50);                    // 佇列已滿（犧牲一格）

    int v;
    dequeue(&q,&v); printf("刪除：%d\\n", v);  // 10
    dequeue(&q,&v); printf("刪除：%d\\n", v);  // 20
    enqueue(&q,50); enqueue(&q,60);    // 前端已釋放，繞環再利用 → 成功

    printf("剩餘：");
    while (!isEmpty(&q)) { dequeue(&q,&v); printf("%d ", v); }  // 30 40 50 60
    printf("\\n");
    return 0;
}`

      question: `「ISO 27001：2013」為目前最普遍被採用的資訊安全管理系統(ISMS)標準規範，請闡述其使用來持續改進 ISMS 整體運作的 PDCA 管理模型及具體工作項目為何？（25分）`,
      answer: `**PDCA 管理模型概述**

ISO 27001 採用 PDCA（Plan-Do-Check-Act，戴明循環）作為 ISMS 持續改進的運作模型，透過四階段不斷循環，使資訊安全管理隨組織環境與威脅變化持續演進、螺旋式提升。

\`\`\`
   Plan ──▶ Do ──▶ Check ──▶ Act
    ▲                          │
    └──────────────────────────┘  (持續循環)
\`\`\`

**Plan（規劃）— 建立 ISMS**
1. 界定 ISMS 範圍與邊界：明確哪些資產、部門、流程納入管理。
2. 訂定資訊安全政策：建立資安方針與目標，取得高階管理階層支持。
3. 資產盤點與分類：識別資訊資產並評估其價值與機敏等級。
4. 風險評鑑（Risk Assessment）：識別威脅與弱點，分析發生可能性與衝擊，評估風險等級。
5. 風險處理（Risk Treatment）：決定處理方式（降低、接受、轉移、避免），選擇控制措施。
6. 製作適用性聲明（SoA）：說明選用與排除哪些控制措施及理由。

**Do（執行）— 實施與營運 ISMS**
1. 實施風險處理計畫，導入所選控制措施。
2. 資源管理：配置人力、預算、技術資源。
3. 教育訓練與意識提升：對全體員工進行資安認知訓練。
4. 營運 ISMS：依規定執行日常資安作業與程序。
5. 建立事件管理機制：偵測與回應資安事件。

**Check（檢查）— 監控與審查 ISMS**
1. 監控與量測：監控控制措施的執行狀況與有效性。
2. 內部稽核（Internal Audit）：定期查核 ISMS 是否符合標準與政策。
3. 管理審查（Management Review）：高階主管定期檢視 ISMS 整體運作績效。
4. 風險再評估：定期重新評鑑風險，確認控制措施仍適當。

**Act（改進）— 維持與改進 ISMS**
1. 採取矯正措施（Corrective Action）：針對稽核或事件發現的缺失進行改善。
2. 採取預防措施（Preventive Action）：預先消除潛在問題的根因。
3. 持續改善：將改善成果回饋到下一輪 Plan，形成持續改進循環。
4. 溝通結果：將 ISMS 運作與改善結果告知相關利害關係人。

**精神**：ISMS 不是一次性專案，而是透過 PDCA 不斷循環，使資安管理隨環境變化持續提升。`,

      answer: `**(一) 巨量資料的 4V 特性（6分）**

1. **Volume（資料量大）**：資料規模龐大，從 TB、PB 到 EB 等級，遠超過傳統資料庫處理能力。
2. **Velocity（速度快）**：資料產生與流入的速度極快，常需即時或近即時處理（如感測器串流、社群訊息）。
3. **Variety（多樣性）**：資料格式多元，涵蓋結構化（資料表）、半結構化（JSON、XML、Log）、非結構化（影像、影音、文字）。
4. **Veracity（真實性 / 正確性）**：資料品質參差不齊，存在雜訊、不確定性與不一致，須評估其可信度。

（部分論述再加 **Value（價值）**：資料價值密度低，需從海量資料中萃取出有用洞察，合稱 5V。）

**(二) Hadoop 架構與核心元件（9分）**

*Hadoop 架構（3分）*
Hadoop 是一套「**開源的分散式運算框架**」，專為處理巨量資料而設計。它將資料與運算分散到由「一般商用硬體」組成的叢集（cluster）上，具高擴展性、高容錯性（資料多份備份），可在不昂貴的硬體上處理 PB 級資料。

*HDFS（Hadoop Distributed File System）功能（3分）*
HDFS 是 Hadoop 的「**分散式檔案系統**」，負責資料的「儲存」。
- 將大檔案切割成固定大小的「區塊（block）」，分散儲存到叢集中多個 DataNode。
- 每個區塊預設複製多份（如 3 份）存於不同節點，達成容錯 —— 某節點故障仍能從副本讀取。
- 採 Master-Slave 架構：NameNode 管理檔案系統的中繼資料（metadata），DataNode 實際儲存資料區塊。

*MapReduce 功能（3分）*
MapReduce 是 Hadoop 的「**分散式運算模型**」，負責資料的「處理」。
- **Map 階段**：將大型運算工作切分成許多小任務，平行分派到各節點，對各自的資料區塊進行處理，產出「鍵-值（key-value）」中間結果。
- **Reduce 階段**：將 Map 產出的中間結果依 key 彙整、合併，產生最終結果。
- 核心精神是「**將運算移到資料所在處**」（move computation to data），減少資料搬移、提升效率。`,

      question: `在進行系統分析時，為提升模組品質以達到良好的系統設計，須評估模組的內聚力及耦合力。請解釋何為耦合力(Coupling)？（10分）`,
      answer: `**耦合力（Coupling）的定義**

耦合力是衡量「**模組與模組之間相互依賴程度**」的指標。耦合度越高，代表模組間關係越緊密、相互依賴越強。

**良好系統設計的原則：低耦合（Low Coupling）**
- 模組間依賴越低，某模組修改時對其他模組的影響越小，系統越易於維護、測試、重用與擴充。
- 設計目標是追求「**低耦合、高內聚**」。

**耦合力的等級（由「最差/最高」到「最佳/最低」）**

1. **內容耦合（Content Coupling）**— 最差
   一個模組直接存取或修改另一模組的內部資料或程式碼。依賴最深，應極力避免。

2. **共用耦合（Common Coupling）**
   多個模組共用同一份全域資料。任一模組修改全域資料會影響其他所有模組。

3. **控制耦合（Control Coupling）**
   一個模組傳遞「控制旗標（flag）」給另一模組，藉以控制其執行流程。呼叫端需了解被呼叫模組的內部邏輯。

4. **標記耦合 / 蓋章耦合（Stamp Coupling）**
   模組間傳遞一整個「資料結構（record/struct）」，但被呼叫模組其實只用到其中部分欄位。傳遞了多餘資訊。

5. **資料耦合（Data Coupling）**— 最佳
   模組間僅透過參數傳遞「必要的、簡單的資料項」，是最理想、最鬆散的耦合方式。

**結論**：系統設計應盡量採用「資料耦合」這類低耦合形式，避免「內容耦合」「共用耦合」等高耦合形式，使模組獨立性最大化，提升系統的可維護性與品質。

（補充：與耦合力相對的是「內聚力 Cohesion」—— 衡量模組「內部元素」彼此關聯的緊密程度，內聚力則是越「高」越好。）`,

   - 相關技術：資料加密（AES、RSA）、存取控制、身分驗證、VPN、權限管理。

   - 意義：確保資訊「未被未授權竄改」，維持其正確性與一致性。
   - 相關技術：雜湊函數（SHA-256）、數位簽章、訊息鑑別碼（MAC）、版本控制、檢查碼。

3. **可用性（Availability）**
   - 意義：確保「授權使用者在需要時能即時、正常地存取」系統與資料。

      answer: `**(一) 薪資小於 50000 之員工數（5分）**
\`\`\`sql
SELECT COUNT(*) AS 員工數

\`\`\`

**(二) 薪資大於直屬主管之員工（5分）**

需將 Emp 表「自我關聯（self join）」—— 同一張表當作「員工」與「主管」兩個角色。員工的 BossEmpNo 對應主管的 EmpNo。
\`\`\`sql
SELECT E.EmpName   AS 員工姓名,
       E.Salary    AS 員工薪資,
       B.Salary    AS 主管薪資
FROM Emp E
JOIN Emp B ON E.BossEmpNo = B.EmpNo   -- E=員工, B=主管, 自我關聯
WHERE E.Salary > B.Salary;            -- 員工薪資 > 主管薪資
\`\`\`

       AVG(E.Salary)           AS 平均薪資
FROM Emp E
JOIN Dep D ON E.DepNo = D.DepNo
GROUP BY D.DepNo, D.DepName

**(二) 三種表示法比較（6分）**

| 表示法 | 形式 | 特性 |
|---|---|---|

| 前序（Prefix） | 運算子在「前」：+ab | 不需括號，可唯一還原 |
| 後序（Postfix） | 運算子在「後」：ab+ | 不需括號，可唯一還原 |

| 2 | push | 5, 2, 3, 2 |

| 1 | push | 5, 2, 1 |
| + | pop 1,2 → 2+1=3，push | 5, 3 |
| − | pop 3,5 → 5-3=2，push | **2** |

      question: `「遞迴」與「迴圈」是程式設計重要手法。

      question: `處理巨量資料時，資料量遠大於記憶體容量。今有一循序檔 data.txt 內含 9 筆資料（6000, 800000, 500, 2, 40, 9000000, 3, 1.5, 70000），欲對該檔排序。受限記憶體容量，讀入時每次最多只能 6 筆。在磁碟處理速度遠低於記憶體下，請以敘述表示法設計一可兼顧減少磁碟存取次數及提高排序效率之排序演算法。（11分）`,
      answer: `**解題思路：外部排序法（External Sorting）**

當資料量大於記憶體時，無法一次全部載入排序，須採「**外部排序法**」。經典方法為「**外部合併排序（External Merge Sort）**」，分為「分割（Run Generation）」與「合併（Merge）」兩階段。

題目：9 筆資料，記憶體每次最多容納 6 筆。

**演算法步驟敘述**

**第一階段：分割並排序（產生已排序的子檔 run）**

1. 從 data.txt 讀入第一批最多 6 筆資料到記憶體：
   - Run 1（讀入）：6000, 800000, 500, 2, 40, 9000000
2. 在「記憶體中」對這 6 筆用「內部排序法（如快速排序）」排序：
   - Run 1（排序後）：2, 40, 500, 6000, 800000, 9000000
   - 將排序好的 Run 1 寫回磁碟成一個暫存檔。
3. 讀入下一批剩餘的 3 筆：
   - Run 2（讀入）：3, 1.5, 70000
4. 在記憶體中排序：
   - Run 2（排序後）：1.5, 3, 70000
   - 寫回磁碟成第二個暫存檔。

此時磁碟上有 2 個「內部已排序」的子檔（run）。

**第二階段：合併（Merge）**

5. 採「多路合併（k-way merge）」。由於記憶體有限，每個 run 只需各取「一小部分（甚至一筆）」進記憶體比較：
   - 從 Run 1 取出最前面元素 2，從 Run 2 取出 1.5。
6. 比較兩者，取「較小者」輸出到結果檔，並從該 run 補進下一筆：
   - 比較 2 與 1.5 → 輸出 1.5，Run 2 補進 3。
   - 比較 2 與 3 → 輸出 2，Run 1 補進 40。
   - 比較 40 與 3 → 輸出 3，Run 2 補進 70000。
   - 比較 40 與 70000 → 輸出 40，Run 1 補進 500。
   - 依此類推，較小者持續輸出。
7. 當某 run 的資料全部輸出完，直接將另一 run 剩餘元素依序輸出。

**最終排序結果**：1.5, 2, 3, 40, 500, 6000, 70000, 800000, 9000000

**效率說明（兼顧減少磁碟存取與排序效率）**

1. **減少磁碟存取**：每筆資料只需「讀 2 次、寫 2 次」磁碟（分割階段讀寫一次、合併階段讀寫一次），總磁碟 I/O 次數可控、線性。
2. **提高排序效率**：分割階段在「記憶體內」用快速排序（O(k log k)），充分利用記憶體的高速；合併階段只需線性掃描比較。
3. 合併時各 run 只載入「部分資料（緩衝區 buffer）」，不需整個 run 進記憶體，符合記憶體限制。
4. 若 run 數量很多，可採「多階段合併（多趟 merge）」進一步管理。

外部合併排序的核心精神：把「昂貴的磁碟存取」次數降到最低（線性次數），把「快速的記憶體運算」效益發揮到最大。`,

實體關係圖（Entity-Relationship Diagram, ERD）是一種「**資料庫概念設計**」的圖形化工具，用來描述系統中的「**實體（Entity）**」、實體的「**屬性（Attribute）**」，以及實體之間的「**關係（Relationship）**」。它幫助系統分析師在實際建立資料庫前，先以視覺化方式釐清資料結構與彼此關聯，是資料庫設計的藍圖。

**(二) 4 個 ERD 物件符號的意義（8分）**

1. **矩形（Rectangle）— 實體（Entity）**
   代表真實世界中可被識別的人、事、物或概念。例：員工、工作、產品。

2. **橢圓形（Ellipse）— 屬性（Attribute）**

3. **菱形（Diamond）— 關係（Relationship）**
   代表實體之間的關聯。例：員工「被分配」工作；學生「選修」課程。

4. **連接線（Line）— 連結（Connection / Link）**
   連接實體與關係、實體與屬性，並可在線上標示「**基數（Cardinality）**」，如 1:1、1:N、M:N，表示關係的對應數量。

      answer: `**(一) 抽象類別及其特性（4分）**

*定義*：抽象類別（Abstract Class）是一種「**不能被直接實體化（new）**」的類別，專門設計來「被繼承」，作為其他類別的共同基底（藍圖）。

*特性*：
1. **不能建立物件**：抽象類別只能被繼承，無法直接 new 出實體。
2. **可包含抽象方法**：抽象方法「只宣告、不實作」（只有方法簽章、沒有方法本體），由子類別負責實作。
3. **可包含一般方法與屬性**：抽象類別也能有已實作的具體方法、欄位、建構子，供子類別繼承共用。
4. **強制子類別實作**：繼承抽象類別的「具體子類別」，「必須」實作（覆寫）所有抽象方法，否則該子類別也必須宣告為抽象。
5. **用途**：定義一組子類別共通的介面規範與部分共用行為，達成「規範一致性」與「程式碼重用」。

// 宣告抽象類別：Shape（形狀）
abstract class Shape {
    protected String name;

    // 建構子（抽象類別也可有建構子，供子類別呼叫）
    public Shape(String name) {
        this.name = name;
    }

    // 抽象方法：只宣告不實作，強制子類別實作
    abstract double area();          // 計算面積
    abstract double perimeter();     // 計算周長

    // 一般（具體）方法：子類別可直接繼承使用
    public void display() {
        System.out.println(name + " 面積=" + area()
                           + " 周長=" + perimeter());
    }
}

// 子類別 Circle 繼承抽象類別 Shape
class Circle extends Shape {
    private double radius;

    public Circle(double radius) {
        super("圓形");              // 呼叫父類別建構子
        this.radius = radius;
    }

    // 實作（覆寫）抽象方法
    @Override
    double area() {
        return Math.PI * radius * radius;
    }
    @Override
    double perimeter() {
        return 2 * Math.PI * radius;
    }
}

// 子類別 Rectangle 繼承抽象類別 Shape
class Rectangle extends Shape {
    private double width, height;

    public Rectangle(double w, double h) {
        super("矩形");
        this.width = w;
        this.height = h;
    }
    @Override
    double area() { return width * height; }
    @Override
    double perimeter() { return 2 * (width + height); }
}

public class Main {
    public static void main(String[] args) {
        // Shape s = new Shape("X");  // 錯誤！抽象類別不能實體化
        Shape c = new Circle(5);
        Shape r = new Rectangle(4, 6);
        c.display();   // 圓形 面積=78.53... 周長=31.41...
        r.display();   // 矩形 面積=24.0 周長=20.0
    }
}`

依 NIST 定義，雲端運算具備 5 項基本特徵：

      answer: `企業導入 ERP（企業資源規劃）系統，常見三種導入策略：

**1. 大爆炸式 / 一次到位導入（Big Bang）**

一次將所有模組、所有部門同時上線，舊系統一次全面切換到新 ERP。

- *優點*：導入期程短、可一次完成整合；避免新舊系統並行的資料同步問題；成本相對集中可控。
- *缺點*：風險最高（一旦失敗影響全公司營運）；變革衝擊大，員工須同時適應所有改變；事前準備與測試要求極高；缺乏緩衝與修正空間。
- *適用*：規模較小、流程單純、或變革決心強的組織。

**2. 階段式 / 漸進式導入（Phased Rollout）**

依「模組」或「功能」分階段陸續上線（如先導入財務模組，再導入採購、生產模組）。

- *優點*：風險分散，每階段問題可在進入下一階段前修正；員工有時間逐步學習適應；可累積經驗。
- *缺點*：導入總期程長；新舊系統須並行運作一段時間，介接與資料同步複雜；整體成本可能較高；長期專案易使團隊疲乏。
- *適用*：中大型組織、流程複雜、求穩健的企業。

**3. 試點式 / 平行導入（Pilot / Parallel）**

先選定「單一據點或部門」作為試點導入 ERP，成功後再推廣到其他單位（平行導入則指新舊系統同時運作比對）。

- *優點*：風險最低、影響範圍小；可在試點驗證系統並修正後再全面推廣；以試點成功經驗作為其他單位的範本與信心來源。
- *缺點*：全面導入所需總時間最長；試點與其他單位間的系統介接需處理；平行運作須維護兩套系統，人力與成本負擔重。
- *適用*：大型、多據點組織，或對風險極度謹慎的企業。

      answer: `**(一) 何謂死結（2分）**

死結（Deadlock）指「兩個或多個交易（transaction），各自持有某些資源（鎖），又同時等待對方持有的資源，導致所有相關交易都無法繼續執行、永久互相等待」的僵局狀態。

**(二) 死結發生的必要條件（6分）**

死結需「同時」滿足以下四個必要條件（Coffman 條件）：

1. **互斥（Mutual Exclusion）**：資源一次只能被一個交易獨佔使用。
2. **持有並等待（Hold and Wait）**：交易已持有至少一個資源，同時又在等待其他被佔用的資源。
3. **不可剝奪（No Preemption）**：資源不能被強制收回，只能由持有的交易主動釋放。
4. **循環等待（Circular Wait）**：存在一個交易的「環狀等待鏈」，每個交易都在等待鏈中下一個交易所持有的資源。

四個條件缺一不可，破壞任一條件即可預防死結。

      answer: `**MVC 架構概述**

MVC（Model-View-Controller）是一種「**軟體設計架構模式**」，將應用程式的功能切分為三個彼此分離的部分 —— 模型、檢視、控制器，達到「**關注點分離（Separation of Concerns）**」。

**各部分功能**

**1. Model（模型）**
- 負責「**資料與商業邏輯**」。
- 管理應用程式的資料、狀態與規則，處理資料的存取、運算、驗證（通常與資料庫互動）。
- 不關心資料如何呈現，是應用程式的核心。

**2. View（檢視）**
- 負責「**資料的呈現與使用者介面**」。
- 將 Model 的資料以使用者看得到的形式顯示出來（網頁、畫面、報表）。
- 只負責「顯示」，不處理商業邏輯。

**3. Controller（控制器）**
- 負責「**接收使用者輸入、協調 Model 與 View**」。
- 接收使用者的操作（點擊、輸入），解讀後呼叫對應的 Model 處理資料，再選擇適當的 View 呈現結果。
- 是 Model 與 View 之間的「橋樑」與「指揮者」。

**運作流程**
\`\`\`
使用者操作 ──▶ Controller ──▶ 呼叫 Model 處理資料
                  │                  │
                  │                  ▼
                  │            Model 更新資料/狀態
                  ▼                  │
            選擇 View ◀───────────────┘
                  │
                  ▼
            View 取得 Model 資料並呈現 ──▶ 使用者
\`\`\`

**MVC 架構的特色（優點）**

1. **關注點分離**：資料、邏輯、呈現各司其職，程式結構清晰。
2. **易於維護**：修改某一部分（如更換 UI）不影響其他部分。
3. **可重用性高**：同一個 Model 可搭配多個不同的 View（如網頁版、手機版共用後端邏輯）。
4. **支援平行開發**：前端工程師負責 View、後端工程師負責 Model，可同時進行。
5. **易於測試**：商業邏輯集中在 Model，可獨立進行單元測試。
6. **彈性與擴充性佳**：低耦合的設計使系統易於擴充。

**應用**：廣泛用於 Web 框架（如 Spring MVC、ASP.NET MVC、Ruby on Rails、Laravel）與桌面、行動應用程式開發。`,

*相鄰串列（Adjacency List）*：每個頂點配一個串列，記錄與它相鄰的所有頂點。
- 空間複雜度：O(n + e)（n 頂點、e 邊）→ 適合「稀疏圖」。

設計 Rational（有理數/分數）類別，重點：
- 「最簡分數」：每次運算後用「最大公因數（GCD）」約分。
- 四則運算公式：
  - 加：a/b + c/d = (a·d + c·b) / (b·d)
  - 減：a/b − c/d = (a·d − c·b) / (b·d)
  - 乘：a/b × c/d = (a·c) / (b·d)
  - 除：a/b ÷ c/d = (a·d) / (b·c)
- 輸出：分母為 1 時輸出整數；結果為 1/1 輸出「1」。

**程式步驟（第二小題 1/6 + 1/3）**：
1. 建立 Rational r1 = new Rational(1, 6) → 化簡仍為 1/6。
2. 建立 Rational r2 = new Rational(1, 3) → 化簡仍為 1/3。
3. 呼叫 r3 = r1.add(r2)：分子 = 1×3 + 1×6 = 9，分母 = 6×3 = 18 → 9/18。

public class Rational {
    private int numerator;     // 分子（private 實體變數）

    // (3) 無引數建構子：初始值 1/1
    public Rational() {
        this.numerator = 1;
        this.denominator = 1;
    }

    // (2) 有引數建構子：建立後即化為最簡分數
    public Rational(int num, int den) {
        if (den == 0)
            throw new ArithmeticException("分母不可為 0");
        // 處理負號：統一讓分母為正
        if (den < 0) { num = -num; den = -den; }
        this.numerator = num;
        this.denominator = den;
        simplify();            // 化為最簡分數
    }

    // 最大公因數（輾轉相除法）
    private int gcd(int a, int b) {
        a = Math.abs(a); b = Math.abs(b);
        while (b != 0) { int t = b; b = a % b; a = t; }
        return (a == 0) ? 1 : a;
    }

    // 化簡為最簡分數
    private void simplify() {
        int g = gcd(numerator, denominator);
        numerator   /= g;
        denominator /= g;
    }

    // 乘法： a/b * c/d = (a*c)/(b*d)

    // 除法： a/b / c/d = (a*d)/(b*c)

}

      answer: `**何謂 RFID**

RFID（無線射頻辨識）是一種「**利用無線電波進行非接觸式自動辨識**」的技術。系統由「**標籤（Tag）**」、「**讀取器（Reader）**」與「後端系統」組成。讀取器發射無線電波，標籤接收後回傳其儲存的識別資料，達成快速、批量、非接觸的物件辨識。
- 標籤分為被動式（無電源，靠讀取器電磁感應供電）與主動式（自帶電源，傳輸距離遠）。
- 應用：物流倉儲管理、門禁卡、ETC 電子收費、圖書館借還書、動物晶片。

**何謂 NFC**

NFC（近場通訊）是一種「**短距離、高頻的無線通訊技術**」，源自 RFID 技術，工作頻率 13.56 MHz，通訊距離極短（約 4~10 公分內）。NFC 裝置可同時具備「讀取」與「被讀取」能力，支援雙向通訊。
- 三種模式：讀寫模式、點對點模式（裝置互傳資料）、卡片模擬模式（手機模擬成感應卡）。
- 應用：行動支付（手機感應付款）、電子票證（悠遊卡）、裝置快速配對、電子名片交換。

**RFID 與 NFC 的主要不同**

| 比較項 | RFID | NFC |
|---|---|---|
| 通訊距離 | 數公分到數十公尺（依頻段與類型） | 極短，約 4~10 公分內 |
| 工作頻率 | 多種頻段（低頻、高頻、超高頻、微波） | 固定 13.56 MHz（高頻） |
| 通訊方向 | 多為「單向」（讀取器讀標籤） | 支援「雙向」通訊 |
| 角色 | 讀取器與標籤角色固定 | 同一裝置可當讀取器，也可當標籤（卡片模擬） |
| 辨識數量 | 可同時讀取大量標籤（批量辨識） | 通常一次一對一通訊 |
| 主要用途 | 物流追蹤、資產管理、長距離辨識 | 行動支付、票證、近距離資料交換 |
| 安全性 | 因距離遠，相對較易被側錄 | 因距離極短，較難被竊聽，安全性較高 |

**關係總結**：NFC 可視為 RFID 技術的「**衍生與延伸**」—— 採用 RFID 的高頻段，但限定極短距離並加入雙向通訊與卡片模擬能力，更適合需要安全性的近距離互動應用（如付款）。`,

    // 終止條件1：節點為空，搜尋失敗

      answer: `**(一) DFS 與 BFS 的說明（10分）**

*深度優先搜尋（Depth First Search, DFS）*
從起始頂點出發，沿著一條路徑「**儘可能往深處走**」，直到走到無路可走（沒有未拜訪的鄰居）為止；然後「**回溯（backtrack）**」到上一個有未拜訪鄰居的頂點，再往另一條路徑深入。如此重複，直到所有頂點都被拜訪。其精神是「一路走到底，再回頭」。

*廣度優先搜尋（Breadth First Search, BFS）*
從起始頂點出發，先「**拜訪所有距離為 1 的鄰居**」，再拜訪所有距離為 2 的頂點，再距離為 3……「**一層一層、由近到遠**」地向外擴展。其精神是「先把附近走遍，再往外擴」。BFS 可用於找「無權圖的最短路徑」。

- 實作上，遞迴版的 DFS 即是利用「系統的呼叫堆疊」自動完成回溯。

*BFS 使用「佇列（Queue）」*
- 原因：BFS 須「先拜訪先發現的頂點」，一層一層擴展，符合「**先進先出（FIFO）**」特性 —— 先被加入的頂點（較近的）要先被處理。
- 將頂點依發現順序放入佇列，依序取出處理其鄰居。

      answer: `**1. DAS（直接附接儲存，Direct Attached Storage）**

DAS 指儲存裝置「**直接連接到單一伺服器或電腦**」（透過 SATA、SAS、USB 等介面），不經過網路。它就像伺服器自己的「外接硬碟」。

- *特性*：架構最簡單、成本低、存取速度快（直連無網路延遲）。
- *限制*：儲存資源「綁定」在單一主機，**無法被其他伺服器共享**；擴充性差；管理分散（每台主機各自管理）。
- *適用*：小型環境、單一伺服器的本機儲存需求。

**2. NAS（網路附接儲存，Network Attached Storage）**

NAS 是一台「**獨立的、連接到區域網路的專屬儲存設備**」，本身具有作業系統與檔案系統。它透過網路以「**檔案層級（file-level）**」提供儲存服務。

- *特性*：透過標準網路協定（NFS、SMB/CIFS）分享檔案，**多台用戶端／伺服器可同時透過網路存取共用檔案**；安裝管理容易；以「檔案」為存取單位。
- *限制*：因走一般區域網路，效能受網路頻寬影響；高負載時效能不如 SAN。
- *適用*：檔案共享、部門共用資料夾、中小企業集中儲存與備份。

**3. SAN（儲存區域網路，Storage Area Network）**

SAN 是一個「**專屬的高速網路**」，將多台儲存設備與多台伺服器連接起來，以「**區塊層級（block-level）**」提供儲存服務。伺服器看到的 SAN 儲存就像「本機磁碟」一樣。

- *特性*：使用專屬高速網路（光纖通道 Fibre Channel、iSCSI），**效能高、延遲低**；儲存資源集中池化、可彈性分配給多台伺服器；擴充性與可用性佳；以「區塊」為存取單位，適合資料庫等高效能應用。
- *限制*：架構複雜、建置與維護成本高、需專業管理。
- *適用*：大型企業、資料中心、資料庫伺服器、虛擬化環境、要求高效能與高可用的關鍵應用。

**三者綜合比較**

| 項目 | DAS | NAS | SAN |
|---|---|---|---|
| 連接方式 | 直連單一主機 | 連接區域網路 | 專屬高速儲存網路 |
| 存取層級 | 區塊層級 | 檔案層級 | 區塊層級 |
| 資源共享 | 不可共享 | 可多機共享檔案 | 可多機共享區塊儲存 |
| 效能 | 快（直連） | 受網路影響 | 最高 |
| 成本與複雜度 | 低 | 中 | 高 |
| 適用規模 | 小型/單機 | 中小企業 | 大型企業/資料中心 |`,

    {
      id: "102-6", no: "六", topic: "mis", topicName: "資管理論與名詞",
      title: "UML 環境圖（Context Diagram）",
      score: 15,
      question: `在結構化塑模語言(UML)中，常使用不同的圖來幫助塑模以利系統分析。請解釋什麼是「環境圖(Context Diagram)」？其所表示的符號為何？並請以適當的圖示繪製及舉例說明之。（15分）`,
      answer: `**何謂環境圖（Context Diagram）**

環境圖（Context Diagram，又稱情境圖）是「**資料流程圖（DFD）的最高層級**」，也稱為「**第 0 層 DFD（Level-0 DFD）**」。

它將「**整個系統視為單一一個程序（一個圓圈）**」，描繪該系統與外部環境（外部實體）之間的「資料流動關係」 —— 呈現有哪些外部實體會與系統互動、彼此間傳遞什麼資料。

環境圖的目的是「**界定系統的範圍與邊界**」—— 清楚劃分「什麼在系統內、什麼在系統外」，以及系統的輸入來源與輸出去向，是系統分析初期釐清需求範疇的重要工具。

**環境圖使用的符號**

| 符號 | 名稱 | 意義 |
|---|---|---|
| ◯ 圓圈（或圓角矩形） | 程序（Process） | 代表「整個系統」，環境圖中只有「一個」 |
| ▭ 方框 | 外部實體（External Entity） | 與系統互動的人、組織或外部系統，位於系統邊界之外（資料的來源 source 或去向 sink） |
| → 箭頭 | 資料流（Data Flow） | 代表外部實體與系統之間流動的資料，箭頭方向表示資料流向 |

注意：環境圖中「**不包含資料儲存（data store）**」，也「**不顯示系統內部細節**」（內部細節留待較低層 DFD 展開）。

**環境圖範例：以「線上購物系統」為例**

\`\`\`htmldiagram
<div class="dg-col">
  <div class="dg-row">
    <div class="dg-box">顧客<div class="dg-sub">External Entity</div></div>
    <div class="dg-col" style="font-size:.72rem;color:var(--ink-soft);">
      <span>訂單、付款資訊 ▶</span>
      <span>◀ 訂單確認、出貨通知</span>
    </div>
    <div class="dg-box ink" style="min-width:8rem;">
      <div><strong>線上購物系統</strong></div>
      <div class="dg-sub">Process（環境圖中唯一程序）</div>
    </div>
    <div class="dg-col" style="font-size:.72rem;color:var(--ink-soft);">
      <span>出貨需求 ▶</span>
      <span>◀ 配送狀態</span>
    </div>
    <div class="dg-box">物流商<div class="dg-sub">External Entity</div></div>
  </div>
  <div class="dg-row" style="margin-top:.6rem;">
    <div class="dg-box">金流（銀行）<div class="dg-sub">External Entity</div></div>
    <div class="dg-col" style="font-size:.72rem;color:var(--ink-soft);">
      <span>付款授權請求 ▶</span>
      <span>◀ 授權結果</span>
    </div>
    <div class="dg-box" style="visibility:hidden;min-width:8rem;">　</div>
    <div class="dg-col" style="font-size:.72rem;color:var(--ink-soft);">
      <span>補貨訂單 ▶</span>
      <span>◀ 商品供應資訊</span>
    </div>
    <div class="dg-box">供應商<div class="dg-sub">External Entity</div></div>
  </div>
  <div class="dg-sub" style="margin-top:.3rem;">※ 中央系統與上下四個外部實體皆有雙向資料流</div>
</div>
\`\`\`

**說明**：
- 中央圓圈「線上購物系統」代表整個待開發系統（環境圖只有一個程序）。
- 四個方框「顧客、物流商、金流(銀行)、供應商」為外部實體 —— 它們在系統範圍「之外」，但會與系統互動。
- 箭頭表示資料流：
  - 顧客「送出訂單與付款資訊」給系統，系統「回傳訂單確認與出貨通知」給顧客。
  - 系統「送出付款授權請求」給銀行，銀行「回傳授權結果」。
  - 系統「送出出貨需求」給物流商，物流商「回傳配送狀態」。
  - 供應商「提供商品供應資訊」，系統「送出補貨訂單」。

透過此環境圖，可一目了然地界定「線上購物系統」的邊界、與哪些外部對象互動、彼此交換哪些資料，作為後續展開詳細 DFD 與系統設計的基礎。`,
      code: null

  ]
}

      question: `ERP(Enterprise Resource Planning) 將企業內價值鏈上跨部門流程資訊整合起來，提供整合資訊及提高整體營運速度。請分別以「策略層級、管理層級、作業層級」觀點，闡述 ERP 為企業帶來的效益。（15分）`,

**各階段工具與互動說明**

**需求擷取階段**
- **流程圖（Flowchart）**：釐清與記錄使用者「現行」作業流程，了解現況需求。產出作為系統分析的輸入。

**系統分析階段**（建立邏輯模型，關注「系統要做什麼」）
- **DFD（資料流程圖）**：承接流程圖，轉化為系統的資料流程邏輯模型，描述資料如何在程序、外部實體、資料儲存間流動。
- **ERD（實體關係圖）**：分析資料結構，描述實體、屬性與關係，建立資料概念模型。
- **資料詞彙（Data Dictionary）**：定義 DFD 與 ERD 中所有資料元素的詳細規格（名稱、型別、長度、意義）。
- **關聯模式（Relational Model）**：將 ERD 轉換為關聯式資料表的邏輯結構。

**系統設計階段**（產出實體設計，關注「系統要怎麼做」）
- **結構圖（Structure Chart）**：將 DFD 邏輯模型轉化為程式的模組階層結構，呈現模組間呼叫關係。
- **模組設計（Module Design）**：依結構圖細部設計各模組功能與介面。
- **處理描述（Process Description）**：以結構化中文、決策表、虛擬碼詳述各模組的內部處理邏輯。
- **正規化（Normalization）**：對關聯模式進行 1NF~3NF 正規化，消除資料異常，產出資料庫實體設計。
- **藍圖（Blueprint）**：整合上述設計，形成完整的系統實體設計藍圖，作為實作依據。

**互動核心精神**：三階段呈「漸進精煉」關係 —— 需求擷取了解「現況」→ 系統分析建立「邏輯模型」→ 系統設計產出「實體設計」。前一階段產出是後一階段輸入，工具彼此銜接，將模糊需求逐步轉化為可實作的系統設計。`,

      score: 10,
      question: `ISO 27001、ISO 27002 作為企業實施 ISMS 的參考與認證標準，請問 ISO 27001 與 ISO 27002 之間的關係為何？（10分）`,
      answer: `兩者同屬 ISO 27000 系列資訊安全標準，角色互補、相輔相成：

**ISO 27001 —「要求標準（Requirements）」**
- 是 ISMS（資訊安全管理系統）的「驗證標準 / 認證標準」。
- 規範組織「應該做什麼」才能建立、實施、維持並持續改進 ISMS —— 包含風險評鑑、風險處理、管理階層責任、內部稽核、管理審查等管理流程的「強制要求」。
- 是「可被稽核、可取得驗證證書」的標準，通過第三方稽核即可取得認證。
- 性質：規範性（normative）、「應該（shall）」的要求。

**ISO 27002 —「實施指引（Code of Practice）」**
- 是資訊安全控制措施的「最佳實務指引 / 實施準則」。
- 詳細說明「如何做、怎麼做」—— 針對各項安全控制措施（存取控制、加密、實體安全、營運安全等）提供具體實施建議與最佳實務。
- 性質：指引性（guidance）、「建議（should）」的參考做法。
- 本身「不能用於驗證認證」，是實施控制措施時的參考手冊。

**兩者的關係**

1. **ISO 27001 是「綱要與要求」，ISO 27002 是「細節與作法」**：ISO 27001 的「附錄 A」條列了一份控制措施清單，而 ISO 27002 正是針對「附錄 A 的每一項控制措施」提供詳細的實施指引。

2. **互補使用**：組織導入 ISMS 時，以 ISO 27001 為架構（依其要求建立管理系統、做風險評鑑、選定控制措施），並以 ISO 27002 為實施參考（依其指引具體落實各項控制措施）。

3. **驗證對象不同**：組織申請的是「ISO 27001 驗證」；ISO 27002 不作為驗證標準，僅是實施時的最佳實務手冊。

**簡言之**：ISO 27001 告訴你「ISMS 必須達到什麼要求、可據以認證」；ISO 27002 告訴你「具體該如何實施那些安全控制措施」。前者是「規範」，後者是「指南」。`,

      question: `類別 Class1 的三個成員變數分別被宣告如下（虛擬碼）：Private V1 as Integer / Protected V2 as Integer / Public V3 as Integer。請問 V1、V2、V3 三個變數，分別能被哪些項目進行存取？（10分）`,
      answer: `物件導向程式設計中，存取修飾子（Access Modifier）控制成員變數的「可見範圍」。三者由嚴到鬆：

可被存取的範圍：

- 不能被類別外部（其他類別、main 程式）存取。

說明：private 是最嚴格的封裝，V1 完全隱藏在 Class1 內部，只有 Class1 自己的成員方法用得到。這是封裝的核心。

**V2 — Protected（保護）**
可被存取的範圍：

說明：protected 介於 private 與 public 之間。對「外界」隱藏，但對「自家的子類別」開放，常用於設計供繼承的基底類別。

      answer: `**(一) 「員工任務」的主鍵（5分）**

分析函數相依：EID→{EName,DID,JobID}、JobID→JName、{EID,Title}→Salary。

要找主鍵，須找出能「決定所有屬性」的最小屬性集合。
- EID 能決定 EName、DID、JobID（再由 JobID 決定 JName）。
- 但 Salary 需由 {EID, Title} 共同決定 —— 單靠 EID 無法決定 Salary，還需 Title。
- 因此主鍵必須包含 EID 與 Title。

**主鍵為 {EID, Title}**。（{EID, Title} 可推導出所有其他屬性。）

**(二) 分解為 3NF（5分）**

原關聯存在「部分相依」與「遞移相依」，須分解：
- EName、DID、JobID 只相依於 EID（部分相依）→ 分出。
- JName 相依於 JobID（遞移相依）→ 分出。
- Salary 完全相依於 {EID, Title}。

**3NF 分解結果（3 個關聯網目）**：
1. **員工(EID, EName, DID, JobID)**，主鍵 EID，外來鍵 DID→部門、JobID→工作
2. **工作(JobID, JName)**，主鍵 JobID
3. **員工薪資(EID, Title, Salary)**，主鍵 {EID, Title}，外來鍵 EID→員工

（加上原有的「部門(DID, DName)」，主鍵 DID。）

**(三) SQL1 vs SQL2 何者正確（10分）**

正確結果應為：Bob-HR、Joe-Mis、Mary-(空白)。

*分析 SQL1*（單一查詢，用 OR）：
\`SELECT EName,DName FROM 員工任務,部門 WHERE 員工任務.DID=部門.DID OR 員工任務.DID is Null\`
這是「員工任務」與「部門」做笛卡兒積後以 WHERE 過濾。
- 對 Bob、Joe：條件 \`DID=部門.DID\` 正確配出 Bob-HR、Joe-Mis。
- 但對 Mary（DID 為 Null）：條件 \`員工任務.DID is Null\` 為真，於是 Mary 這列會與「部門」表的「每一筆」記錄都配對成功！

Bob   | HR
Joe   | Mis
Mary  | HR      ← 錯誤
Mary  | Mis     ← 錯誤
Mary  | Sale    ← 錯誤
\`\`\`

*正確寫法應使用「左外部連接（LEFT OUTER JOIN）」*：
\`\`\`sql
SELECT E.EName, D.DName
FROM 員工任務 E
LEFT OUTER JOIN 部門 D ON E.DID = D.DID
ORDER BY E.EName, D.DName;
\`\`\`
左外部連接保留「員工任務」全部資料，DID 為 Null 的 Mary 其 DName 自動填 Null，得到正確結果（Bob-HR、Joe-Mis、Mary-Null），Mary 只出現一次。`,

      answer: `**Overloading（超載 / 多載）**

*定義*：在「同一個類別」中，定義「多個名稱相同、但參數列不同」的方法。參數列不同指參數的「數量」「型別」或「順序」不同。

*特性*：發生在同一類別內、與繼承無關、由編譯器在「編譯期」依引數決定執行版本（靜態繫結、編譯期多型）、回傳型別不能作為區分依據。

*例子*：
\`\`\`java
class Calculator {
    int add(int a, int b)          { return a + b; }
    int add(int a, int b, int c)   { return a + b + c; }   // 參數數量不同
    double add(double a, double b) { return a + b; }       // 參數型別不同
}
\`\`\`

**Overriding（覆寫 / 改寫）**

*定義*：「子類別」重新定義「父類別中已存在、且簽章完全相同」的方法。方法名稱、參數列、回傳型別都必須相同。

*特性*：發生在父類別與子類別之間、必須有繼承關係、子類別版本取代父類別版本、由「執行期」依物件實際型別決定執行版本（動態繫結、執行期多型）。

*例子*：
\`\`\`java
class Animal { void makeSound() { System.out.println("動物發出聲音"); } }
class Dog extends Animal {
    @Override void makeSound() { System.out.println("汪汪叫"); }
}
Animal a = new Dog();  a.makeSound();  // 輸出「汪汪叫」(Dog 版本)
\`\`\`

**兩者差別總整理**

| 比較項 | Overloading | Overriding |
|---|---|---|
| 發生位置 | 同一個類別內 | 父類別與子類別之間 |
| 是否需繼承 | 不需要 | 必須有繼承關係 |
| 方法名稱 | 相同 | 相同 |
| 參數列 | 必須不同 | 必須完全相同 |
| 回傳型別 | 可不同 | 必須相同 |
| 繫結時機 | 編譯期（靜態繫結） | 執行期（動態繫結） |
| 多型類型 | 編譯期多型 | 執行期多型 |
| 目的 | 同一功能因應不同參數 | 子類別改變父類別行為 |`,

      score: 15,
      question: `請撰寫程式，求出 N! 的結果值中，從右邊算來第一個不是 0 的數字位置。例如 N=3 時 3!=6 位置為 1；N=5 時 5!=120 位置為 2；N=10 時 10!=3628800 位置為 3。撰寫過程請註明程式語言並加註解。N 的 I/O 部分可用虛擬碼代替，其餘不得用虛擬碼。（15分）`,
      answer: `**解題思路**

「從右邊算來第一個不是 0 的數字位置」，本質上就是：**N! 末尾有幾個 0，答案就是「0 的個數 + 1」**。

例如 10! = 3628800，末尾有 2 個 0，第一個非零數字（8）在第 3 位 → 答案 = 2 + 1 = 3。

*關鍵：如何計算 N! 末尾有幾個 0？*
- 末尾的 0 由「因數 10」產生，而 10 = 2 × 5。
- 在 N! 的質因數分解中，「因數 2」的個數遠多於「因數 5」。
- 所以「末尾 0 的個數 = N! 中因數 5 的個數」（由 5 的數量決定）。

*計算 N! 中因數 5 的個數（Legendre 公式）*：
\`因數5個數 = ⌊N/5⌋ + ⌊N/25⌋ + ⌊N/125⌋ + ...\`
例：N=10 → ⌊10/5⌋ + ⌊10/25⌋ = 2 + 0 = 2 個 0 → 位置 = 3 ✔

*優點*：不需真的算出 N!（N 大時會溢位），只需做除法累加，效率高、無溢位。`,

#include <stdio.h>

/*
 * 求 N! 從右算來第一個非零數字的「位置」
 * 原理：位置 = N! 末尾 0 的個數 + 1
 *       末尾 0 的個數 = N! 質因數分解中「因數 5」的個數
 *       因數 5 個數 = N/5 + N/25 + N/125 + ...（整數除法）
 */
int firstNonZeroPosition(int n) {
    int countZero = 0;          // N! 末尾 0 的個數
    for (long long divisor = 5; divisor <= n; divisor *= 5) {
        countZero += n / divisor;   // 整數除法，自動無條件捨去
    }
    return countZero + 1;       // 第一個非零數字的位置 = 0 個數 + 1
}

int main() {
    int n;
    // N 的 I/O 部分（依題意可用虛擬碼代替）：
    // READ n   ── 由使用者輸入正整數 n
    printf("請輸入正整數 N：");
    scanf("%d", &n);

    printf("N=%d 時，N! 從右算來第一個非零數字位置為：%d\\n",
           n, firstNonZeroPosition(n));
    return 0;
}

/* 驗證：

   N=5  → 因數5個數=1 → 位置 2  (5!=120)
   N=10 → 因數5個數=2 → 位置 3  (10!=3628800)

      answer: `**(一) 參考完整性限制（3分）**

參考完整性限制是關聯式資料庫的一種「完整性規則」，用來維護資料表之間「外來鍵」關聯的正確性與一致性。

規則：一個資料表中「外來鍵欄位」的值，必須存在於它所參照的另一個資料表的「主鍵」中，或者為 Null。

目的：防止出現「孤兒記錄（orphan record）」—— 例如訂單表中某筆訂單的「客戶編號」，必須是客戶表中真實存在的客戶。

**(二) 何謂 Trigger（觸發程序）（3分）**

Trigger 是「儲存在資料庫中、會在特定資料異動事件發生時『自動執行』的一段程式」。
- 它依附於某個資料表。
- 由「事件」自動觸發 —— 當對該表執行 INSERT、UPDATE、DELETE 時自動啟動，無需人工呼叫。
- 可設定在事件「之前(BEFORE)」或「之後(AFTER)」執行。
- 常用於：資料驗證、維護資料一致性、記錄稽核日誌、自動更新關聯資料。

**(三) 以 Trigger 完成參考完整性的範例（4分）**

情境：有「客戶表 Customer(CID, CName)」與「訂單表 Orders(OID, CID, ...)」，Orders.CID 是參照 Customer.CID 的外來鍵。要確保「新增訂單時，其客戶編號必須存在於客戶表」。

\`\`\`sql
-- 在訂單表新增資料「之前」自動檢查
CREATE TRIGGER trg_check_customer
BEFORE INSERT ON Orders
FOR EACH ROW
BEGIN
    DECLARE cnt INT;
    SELECT COUNT(*) INTO cnt FROM Customer
    WHERE CID = NEW.CID;          -- 檢查欲插入的 CID 是否存在
    IF cnt = 0 THEN               -- 找不到 → 拒絕新增
        SIGNAL SQLSTATE '45000'
        SET MESSAGE_TEXT = '錯誤：該客戶編號不存在，違反參考完整性';
    END IF;
END;
\`\`\`

運作：每當對 Orders 執行 INSERT，此 Trigger 在「插入動作之前」自動執行，查詢 Customer 表確認新訂單的客戶編號是否存在；不存在則發出錯誤、阻止新增 → 達成「外來鍵值必須存在於主表」的參考完整性。同理可在 Customer 表建立 BEFORE DELETE Trigger，檢查「該客戶是否還有訂單」以維護刪除時的完整性。

（註：現代 RDBMS 多可直接用 FOREIGN KEY 約束自動達成；本題旨在說明「也可用 Trigger 以程式邏輯手動實現」相同效果。）`,

      answer: `**(一) 內聚力、耦合力與良好設計準則（4分）**

*內聚力（Cohesion）*：衡量「單一模組『內部』各元素之間，彼此關聯緊密程度」的指標。模組功能單一專一即為高內聚。由低到高：偶然 < 邏輯 < 時間 < 程序 < 通訊 < 順序 < 功能內聚（最佳）。內聚力**越高越好**。

*耦合力（Coupling）*：衡量「模組與模組『之間』相互依賴程度」的指標。耦合度越高代表相互牽連越深。由高(差)到低(佳)：內容 > 共用 > 控制 > 標記 > 資料耦合（最佳）。耦合力**越低越好**。

*良好系統設計準則*：**「高內聚、低耦合」**。每個模組功能單一明確（高內聚），模組之間依賴關係最少（低耦合）。如此使系統易於理解、維護、測試、修改與重用，修改某模組時對其他模組衝擊最小。

**(二) 物件導向程式語言的三大特徵（6分）**

1. **封裝（Encapsulation）**：將「資料」與「操作方法」包裝結合，並隱藏內部實作細節，只對外開放必要介面。透過存取修飾子控制可見性。目的是保護資料完整性、降低複雜度。

2. **繼承（Inheritance）**：子類別可「承襲」父類別的屬性與方法，並可擴充或修改。形成「is-a」關係。目的是達成「程式碼重用」並建立類別階層。

3. **多型（Polymorphism，同名異式）**：「同一個介面或方法名稱」在不同情境下表現出「不同行為」—— 一個介面、多種實作。包含覆寫（執行期）與超載（編譯期）。目的是提升程式彈性與擴充性。

（補充：部分論述會將「抽象 Abstraction」也列為特徵之一，但最經典的三大特徵為封裝、繼承、多型。）`,

      answer: `**解題思路**

**gcd(a, b) = gcd(b, a mod b)**，當 b = 0 時 gcd(a, 0) = a。

原理：a 與 b 的最大公因數，等於 b 與「a 除以 b 的餘數」的最大公因數。不斷以餘數取代，直到餘數為 0，此時的除數即為最大公因數。

|---|---|---|---|

| 3 | gcd(992, 93) | 992 mod 93 = 71 | gcd(93, 71) |
| 4 | gcd(93, 71) | 93 mod 71 = 22 | gcd(71, 22) |

| 7 | gcd(5, 2) | 5 mod 2 = 1 | gcd(2, 1) |

#include <stdio.h>

/*
 * 計算最大公因數的遞迴演算法（輾轉相除法）
 * 原理：gcd(a,b) = gcd(b, a mod b)，b=0 時 gcd = a
 */
int gcd(int a, int b) {
    if (b == 0)              // 終止條件：餘數為 0
        return a;            // 此時 a 即為最大公因數
    return gcd(b, a % b);    // 遞迴：以 (b, a mod b) 繼續
}

int main() {
    int a = 31031, b = 10013;
    printf("gcd(%d, %d) = %d\\n", a, b, gcd(a, b));

}

      answer: `**解題思路**

組合數 C(n,k) = n! / (k!·(n-k)!)。若直接算階乘，n! 數字極大、極易溢位。

*兩個關鍵最佳化*：

1. **利用對稱性減少運算量**：C(n,k) = C(n, n-k)。先取 \`k = min(k, n-k)\`，使迴圈次數變少（例 C(100,98) 改算 C(100,2)，只需迴圈 2 次）。

2. **邊乘邊除，防止溢位**：不要先算出整個分子再除分母。改用「逐步累乘累除」—— 利用數學性質：第 i 步計算 \`result = result * (n-k+i) / i\`。可以證明每一步的 result 永遠是整數（因為連續 i 個整數的乘積必能被 i! 整除），所以邊乘邊除不會產生小數，且能讓中間值維持較小，避免溢位。

公式：C(n,k) = Π(i=1 到 k) [(n-k+i) / i]

**演算法流程圖**

</div>
\`\`\`

**流程圖說明**

1. 輸入 n、k（n > k > 0）。
2. 判斷對稱性：若 k > n−k，將 k 改為 n−k，減少迴圈次數（效率最佳化）。
3. 初始化 result = 1、i = 1。
4. 迴圈：每次 \`result = result * (n-k+i) / i\`（邊乘邊除，防溢位）。
   - 分子 (n-k+i) 從 (n-k+1) 逐步乘到 n。
   - 分母 i 從 1 逐步除到 k。
5. i 累加，當 i ≤ k 時繼續迴圈。
6. 迴圈結束，輸出 result 即為 C(n,k)。

**範例**：C(5,2) → k=2（2 < 3，不交換）→
- i=1：result = 1 × (5-2+1)/1 = 4/1 = 4
- i=2：result = 4 × (5-2+2)/2 = 4×5/2 = 10
- 輸出 10 ✔（C(5,2)=10）
